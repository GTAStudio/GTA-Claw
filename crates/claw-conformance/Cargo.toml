[package]
name = "claw-conformance"
description = "Automated OpenClaw upstream-parity conformance harness for GTA Claw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cap-fs-ext = "=3.4.5"
cap-std = "=3.4.5"
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
toml = "=1.1.3"
toml_edit = { version = "=0.25.13", default-features = false, features = ["parse"] }
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints.rust]
missing_docs = "warn"
# Windows has no safe std API for the 128-bit FILE_ID_INFO identity. The single
# audited FFI module in claims.rs is locally expected; unsafe remains denied
# everywhere else in this crate.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "warn"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
too_many_lines = "allow"

[[bin]]
name = "claw-conformance"
path = "src/main.rs"
