[package]
name = "claw-goals"
description = "Durable on-disk session goals for GTA Claw: crash-safe storage, budgets, and the compaction anchor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
include = ["Cargo.toml", "src/**", "tests/**"]

[dependencies]
claw-application = { workspace = true, features = ["runtime-ports"] }
claw-domain.workspace = true
claw-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tokio = { version = "=1.52.3", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
