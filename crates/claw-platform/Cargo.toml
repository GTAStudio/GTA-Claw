[package]
name = "claw-platform"
description = "Native platform adapters for GTA Claw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
native-identity = ["dep:claw-provider-sdk", "dep:claw-security", "dep:ring", "dep:sha2", "dep:zeroize", "dep:rustix"]
native-config = ["dep:claw-config", "dep:claw-tools", "dep:ring", "dep:zeroize"]

[dependencies]
claw-application.workspace = true
claw-protocol.workspace = true
claw-config = { workspace = true, optional = true }
claw-tools = { workspace = true, optional = true }
claw-provider-sdk = { workspace = true, optional = true }
claw-security = { workspace = true, optional = true }
ring = { version = "=0.17.14", optional = true }
sha2 = { workspace = true, optional = true }
zeroize = { version = "=1.9.0", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"], optional = true }

[lints]
workspace = true
