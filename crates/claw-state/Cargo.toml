[package]
name = "claw-state"
description = "Transactional native state storage for GTA Claw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
claw-application = { workspace = true, features = ["runtime-ports"] }
claw-domain.workspace = true
redb = "=4.2.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "=1.53.1", features = ["rt", "sync", "macros"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[lints]
workspace = true