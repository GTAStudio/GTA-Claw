[package]
name = "claw-providers"
description = "Frozen OpenClaw provider registry with pure-Rust OpenAI, Anthropic and GitHub Copilot implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bytes = "=1.12.1"
claw-provider-sdk.workspace = true
futures-core = "=0.3.32"
futures-util = { version = "=0.3.32", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.52.3", default-features = false, features = ["macros", "rt", "sync", "time"] }
url = "=2.5.8"

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
