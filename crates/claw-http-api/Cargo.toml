[package]
name = "claw-http-api"
description = "Bounded Axum HTTP, SSE, OpenAI, watch-node, and admin API for GTA Claw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["json", "tokio"] }
base64 = "=0.22.1"
claw-protocol.workspace = true
claw-security.workspace = true
futures-core = "=0.3.32"
getrandom = "=0.4.3"
http = "=1.4.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "=2.6.1"
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "=0.1.18"
tokio-util = { version = "=0.7.18", features = ["rt"] }
tower-http = { version = "=0.6.8", features = ["cors", "set-header"] }
url = "=2.5.8"

[lints]
workspace = true
