[package]
name = "claw-runtime"
description = "Agent execution runtime for GTA Claw: sessions, streaming, tools, goals, suspension, and workers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
claw-application = { workspace = true, features = ["runtime-ports"] }
claw-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
