[package]
name = "claw-plugin-host"
description = "Wasmtime component-model host that runs GTA Claw WebAssembly plugins in a deny-by-default sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
claw-plugin-api = { workspace = true }
claw-security = { workspace = true }
# Pinned to the 0.2 line that `ring` already resolves in the root graph. A newer
# getrandom would add a second version of the crate and `deny.toml` - which is
# a frozen trust-root file - forbids duplicates.
getrandom = "=0.2.17"
http = "=1.4.2"
httparse = "=1.10.1"
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
rustls-pki-types = "=1.15.1"
serde_json.workspace = true
wasmtime = { version = "=47.0.2", default-features = false, features = [
  "component-model",
  "cranelift",
  "runtime",
  "std",
] }

[dev-dependencies]
ed25519-dalek = "=3.0.0"
serde.workspace = true
wat = "=1.252.0"

[lints]
workspace = true
