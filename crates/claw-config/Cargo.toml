[package]
name = "claw-config"
description = "Strict JSON5 configuration and legacy migration boundary for GTA Claw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = [
  "Cargo.toml",
  "README.md",
  "build.rs",
  "build_support.rs",
  "data/**",
  "src/**",
  "tests/**",
]

[dependencies]
json5 = "1.3.1"
schemars = "1.2.1"
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
url = "2.5.8"

[build-dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[lints.rust]
missing_docs = "warn"
# Windows-only `ReplaceFileW` atomic-rename FFI in `io::windows_replace` needs a
# local `allow(unsafe_code)`, which `forbid` cannot grant.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "warn"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
too_many_lines = "allow"
