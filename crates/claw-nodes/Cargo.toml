[package]
name = "claw-nodes"
description = "Authenticated node identity, discovery, and connectivity for GTA Claw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "=0.1.91"
base64 = "=0.22.1"
claw-protocol.workspace = true
claw-security.workspace = true
russh = { version = "=0.62.4", default-features = false, features = ["ring"] }
secrecy = "=0.10.3"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "=2.5.8"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
flume = "=0.12.0"
hickory-resolver = "=0.26.1"
mdns-sd = { version = "=0.20.2", default-features = false }
socket2 = "=0.6.5"

[dev-dependencies]
rand_chacha = "=0.10.0"

[lints]
workspace = true
