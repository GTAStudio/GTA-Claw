[package]
name = "claw-provider-sdk"
description = "Typed model-provider abstraction, streaming decoder, reliability policies and credential ports for GTA Claw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bytes = "=1.12.1"
futures-core = "=0.3.32"
futures-util = { version = "=0.3.32", default-features = false, features = ["std"] }
http = "=1.4.0"
keyring-core = "=1.0.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.52.3", default-features = false, features = ["macros", "rt", "sync", "time"] }
url = "=2.5.8"
zeroize = "=1.9.0"

# Native credential stores are linked only where they exist, so a Linux build
# pulls no platform keystore code at all.
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.1", default-features = false }

[dev-dependencies]
futures-util = { version = "=0.3.32", default-features = false, features = ["std"] }
serde_json.workspace = true
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "=2.5.8"

[lints]
workspace = true
