[package]
name = "claw-provider-sdk"
description = "Typed model-provider abstraction, streaming decoder, reliability policies and credential ports for GTA Claw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bytes = "=1.12.1"
futures-core = "=0.3.32"
futures-util = { version = "=0.3.32", default-features = false, features = ["std"] }
http = "=1.4.0"
http-body-util = "=0.1.4"
hyper = { version = "=1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy", "client-proxy", "http1", "tokio"] }
keyring-core = "=1.0.0"
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
rustls-pki-types = "=1.15.0"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.52.3", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tower-service = "=0.3.3"
url = "=2.5.8"
zeroize = "=1.9.0"

# Native credential stores are linked only where they exist, so a Linux build
# pulls no platform keystore code at all.
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.1", default-features = false, features = ["keychain"] }

[dev-dependencies]
futures-util = { version = "=0.3.32", default-features = false, features = ["std"] }
serde_json.workspace = true
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "=2.5.8"

[lints]
workspace = true
