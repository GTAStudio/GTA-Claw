[package]
name = "claw-gateway"
description = "OpenClaw Gateway protocol v4 WebSocket server for GTA Claw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "=0.22.1"
claw-protocol.workspace = true
claw-security.workspace = true
fastwebsockets = { version = "=0.10.0", default-features = false, features = ["unstable-split"] }
httparse = "=1.10.1"
ring = "=0.17.14"
secrecy = "=0.10.3"
serde.workspace = true
serde_json.workspace = true
sha1 = "=0.11.0"
subtle = "=2.6.1"
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
claw-gateway-client.workspace = true
rand_chacha = "=0.10.0"
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "=2.5.8"

[lints]
workspace = true
