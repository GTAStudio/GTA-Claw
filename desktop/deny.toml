[graph]
all-features = true

[advisories]
# Slint 1.17.1 reaches these unmaintained, non-vulnerable crates through its
# image/font stack. None has a safe compatible upgrade at this pinned version.
ignore = [
  "RUSTSEC-2024-0436", # paste through image/exr
  "RUSTSEC-2026-0192", # ttf-parser through Slint's resvg stack
  "RUSTSEC-2026-0206", # rustybuzz through Slint's resvg stack
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "LicenseRef-Slint-Royalty-free-2.0",
  "MIT",
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
# One policy covers both target graphs; BSL-1.0 is Windows-only.
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Gateway onboarding adds getrandom 0.4 directly while ring retains 0.2.
# Ed25519/fastwebsockets retain rand_core 0.6 while getrandom uses 0.10.
# Slint retains thiserror 1 while the Gateway transport graph uses thiserror 2.
# Slint's all-features policy graph also includes platform and Skia build
# dependencies that are not selected by the desktop application's explicit
# femtovg/software feature set. Keep every exception exact and version-pinned.
skip = [
  { name = "bitflags", version = "=1.3.2" },
  { name = "block2", version = "=0.5.1" },
  { name = "core-foundation", version = "=0.9.4" },
  { name = "getrandom", version = "=0.2.17" },
  { name = "getrandom", version = "=0.3.4" },
  { name = "hashbrown", version = "=0.14.5" },
  { name = "hashbrown", version = "=0.16.1" },
  { name = "itertools", version = "=0.13.0" },
  { name = "jni-sys", version = "=0.3.1" },
  { name = "linux-raw-sys", version = "=0.4.15" },
  { name = "nom", version = "=7.1.3" },
  { name = "objc2", version = "=0.5.2" },
  { name = "objc2-app-kit", version = "=0.2.2" },
  { name = "objc2-foundation", version = "=0.2.2" },
  { name = "objc2-ui-kit", version = "=0.2.2" },
  { name = "r-efi", version = "=5.3.0" },
  { name = "rand", version = "=0.8.7" },
  { name = "rand_chacha", version = "=0.3.1" },
  { name = "rand_core", version = "=0.6.4" },
  { name = "rand_core", version = "=0.9.5" },
  { name = "redox_syscall", version = "=0.4.1" },
  { name = "redox_syscall", version = "=0.5.18" },
  { name = "rustc-hash", version = "=1.1.0" },
  { name = "rustix", version = "=0.38.44" },
  { name = "shlex", version = "=1.3.0" },
  { name = "smol_str", version = "=0.2.2" },
  { name = "thiserror", version = "=1.0.69" },
  { name = "thiserror-impl", version = "=1.0.69" },
  { name = "windows-sys", version = "=0.52.0" },
  { name = "windows-sys", version = "=0.59.0" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
