[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# fastwebsockets 0.10 uses rand 0.8 solely for RFC 6455 client masking.
# ring 0.17 pins windows-sys 0.52 for rustls cryptography internals.
skip = [
  { name = "rand_core", version = "0.6.4" },
  { name = "windows-sys", version = "0.52.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
