[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# fastwebsockets 0.10 uses rand 0.8 solely for RFC 6455 client masking.
# ring 0.17 pins windows-sys 0.52 for rustls cryptography internals.
[[bans.skip]]
name = "getrandom"
version = "=0.2.17"

[[bans.skip]]
name = "rand"
version = "=0.8.7"

[[bans.skip]]
name = "rand_core"
version = "=0.6.4"

# fastwebsockets 0.10 and ring 0.17 remain on getrandom 0.2 while Hickory 0.26
# and russh 0.62 require the current getrandom 0.4 line.
[[bans.skip]]
name = "getrandom"
version = "=0.2.17"

# fastwebsockets 0.10 retains rand 0.8 while russh and hickory-resolver use 0.10.
[[bans.skip]]
name = "rand"
version = "=0.8.7"

# Apple-target dependencies straddle the core-foundation 0.9 and 0.10 lines.
[[bans.skip]]
name = "core-foundation"
version = "=0.9.4"

# Build dependencies straddle syn 2 and syn 3; syn is not linked into the runtime.
[[bans.skip]]
name = "syn"
version = "=3.0.3"

# russh 0.62 contains sha3 0.11 in its SSH subtree while the graph also uses 0.12.
[[bans.skip]]
name = "sha3"
version = "=0.11.0"

[[bans.skip]]
name = "windows-sys"
version = "=0.52.0"

[[bans.skip]]
name = "thiserror"
version = "=1.0.69"

[[bans.skip]]
name = "thiserror-impl"
version = "=1.0.69"

# Hickory's OS resolver and the native TLS root loader currently straddle the
# Core Foundation 0.9/0.10 transition on Apple targets.
[[bans.skip]]
name = "core-foundation"
version = "=0.9.4"

# Hickory 0.26 and russh 0.62 use syn 3 while the established workspace
# procedural macros remain on syn 2.
[[bans.skip]]
name = "syn"
version = "=3.0.3"

# russh 0.62 directly uses SHA-3 0.12 while its ML-KEM 0.3 dependency is still
# on SHA-3 0.11.
[[bans.skip]]
name = "sha3"
version = "=0.11.0"

# SQLx 0.9 still uses the previous RustCrypto stack while claw-state uses the
# latest stable SHA-2 API. SQLx also resolves two intentional hashbrown lines.
[[bans.skip]]
name = "block-buffer"
version = "=0.10.4"

[[bans.skip]]
name = "cpufeatures"
version = "=0.2.17"

[[bans.skip]]
name = "crypto-common"
version = "=0.1.7"

[[bans.skip]]
name = "digest"
version = "=0.10.7"

[[bans.skip]]
name = "hashbrown"
version = "=0.16.1"

[[bans.skip]]
name = "sha2"
version = "=0.10.9"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
