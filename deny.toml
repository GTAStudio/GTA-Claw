[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# fastwebsockets 0.10 uses rand 0.8 solely for RFC 6455 client masking.
# ring 0.17 pins windows-sys 0.52 for rustls cryptography internals.
[[bans.skip]]
name = "rand_core"
version = "=0.6.4"

# Build dependencies straddle syn 2 and syn 3; syn is not linked into the runtime.
[[bans.skip]]
name = "syn"
version = "=3.0.3"

[[bans.skip]]
name = "windows-sys"
version = "=0.52.0"

[[bans.skip]]
name = "thiserror"
version = "=1.0.69"

[[bans.skip]]
name = "thiserror-impl"
version = "=1.0.69"

# SQLx 0.9 still uses the previous RustCrypto stack while claw-state uses the
# latest stable SHA-2 API. SQLx also resolves two intentional hashbrown lines.
[[bans.skip]]
name = "block-buffer"
version = "=0.10.4"

[[bans.skip]]
name = "cpufeatures"
version = "=0.2.17"

[[bans.skip]]
name = "crypto-common"
version = "=0.1.7"

[[bans.skip]]
name = "digest"
version = "=0.10.7"

[[bans.skip]]
name = "hashbrown"
version = "=0.16.1"

[[bans.skip]]
name = "sha2"
version = "=0.10.9"

# Hickory 0.26's system resolver uses core-foundation 0.9 while the native
# certificate stack uses 0.10. Remove when Hickory's system resolver no longer
# appears in `cargo tree -i core-foundation@0.9.4`.
[[bans.skip]]
name = "core-foundation"
version = "=0.9.4"

# russh 0.62 requires generic-array 1.x, and the 1.x line depends on 0.14 through
# its non-optional compat-0_14 bridge. The duplicate is therefore structural: no
# version selection elsewhere in the graph can eliminate it. Re-evaluate when
# Cranelift migrates to SHA-2 0.11; remove only when the inverse tree also proves
# that russh no longer requires the bridge.
[[bans.skip]]
name = "generic-array"
version = "=0.14.7"

# Ring, claw-plugin-host, and the legacy gateway stack use getrandom 0.2 while
# russh's current cryptography uses 0.4. Remove when
# `cargo tree -i getrandom@0.2.17` has no path.
[[bans.skip]]
name = "getrandom"
version = "=0.2.17"

# fastwebsockets 0.10 uses rand 0.8 while Hickory and russh use 0.10. Remove when
# `cargo tree -i rand@0.8.7` no longer reaches the gateway stack.
[[bans.skip]]
name = "rand"
version = "=0.8.7"

# ml-kem 0.3 uses SHA-3 0.11 while russh 0.62 directly uses 0.12. Remove when
# `cargo tree -i sha3@0.11.0` no longer reaches russh through ml-kem.
[[bans.skip]]
name = "sha3"
version = "=0.11.0"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
