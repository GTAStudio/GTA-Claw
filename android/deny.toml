[graph]
all-features = true

[advisories]
ignore = [
  # Slint 1.17.1's image pipeline still reaches these unmaintained crates.
  # They are not vulnerabilities, and there is no compatible replacement in
  # the pinned Slint graph.
  "RUSTSEC-2024-0436",
  "RUSTSEC-2026-0192",
  "RUSTSEC-2026-0206",
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "LicenseRef-Slint-Royalty-free-2.0",
  "MIT",
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
  # Exact older lines required by the Slint compiler, Android backend, Skia
  # build, and the existing Gateway core. Every exception is version-bounded.
  { name = "font-types", version = "=0.11.3" },
  { name = "getrandom", version = "=0.2.17" },
  { name = "getrandom", version = "=0.3.4" },
  { name = "hashbrown", version = "=0.14.5" },
  { name = "hashbrown", version = "=0.16.1" },
  { name = "itertools", version = "=0.13.0" },
  { name = "jni-sys", version = "=0.3.1" },
  { name = "nom", version = "=7.1.3" },
  { name = "r-efi", version = "=5.3.0" },
  { name = "rand", version = "=0.8.7" },
  { name = "rand_chacha", version = "=0.3.1" },
  { name = "rand_core", version = "=0.6.4" },
  { name = "rand_core", version = "=0.9.5" },
  { name = "read-fonts", version = "=0.39.2" },
  { name = "rustc-hash", version = "=1.1.0" },
  { name = "shlex", version = "=1.3.0" },
  { name = "skrifa", version = "=0.42.1" },
  { name = "syn", version = "=2.0.119" },
  { name = "thiserror", version = "=1.0.69" },
  { name = "thiserror-impl", version = "=1.0.69" },
  { name = "windows-sys", version = "=0.52.0" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
