[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "LicenseRef-Slint-Royalty-free-2.0",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
# One policy covers the host graph and all three Android ABI graphs, so some
# entries are unused on whichever target is being evaluated.
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Every entry is an *older* version retained by an upstream dependency that the
# Android graph cannot currently be talked out of. Grouped by cause:
#
# Slint 1.17's font stack (fontique/parley/swash) pins an older read-fonts
# generation than the resvg/usvg side of the same graph:
#   font-types, read-fonts, skrifa
# ring keeps getrandom 0.2 and ed25519-dalek/fastwebsockets keep rand_core 0.6,
# while the Gateway onboarding path uses the current generation:
#   getrandom, rand_core
# android-activity 0.6 links jni-sys 0.3 while jni 0.22 uses 0.4:
#   jni-sys
# Build-time only (proc-macro and build-script tooling):
#   itertools, nom, rustc-hash, shlex, syn
# Slint retains thiserror 1 while the Gateway transport graph uses thiserror 2:
#   thiserror, thiserror-impl
# hashbrown spans three generations across indexmap, the compiler and Skia.
skip = [
  { name = "font-types", version = "=0.11.3" },
  { name = "getrandom", version = "=0.2.17" },
  { name = "getrandom", version = "=0.3.4" },
  { name = "hashbrown", version = "=0.14.5" },
  { name = "hashbrown", version = "=0.16.1" },
  { name = "itertools", version = "=0.13.0" },
  { name = "jni-sys", version = "=0.3.1" },
  { name = "nom", version = "=7.1.3" },
  { name = "rand_core", version = "=0.6.4" },
  { name = "rand_core", version = "=0.9.5" },
  { name = "read-fonts", version = "=0.39.2" },
  { name = "rustc-hash", version = "=1.1.0" },
  { name = "shlex", version = "=1.3.0" },
  { name = "skrifa", version = "=0.42.1" },
  { name = "syn", version = "=2.0.119" },
  { name = "thiserror", version = "=1.0.69" },
  { name = "thiserror-impl", version = "=1.0.69" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
