[package]
name = "gta-claw-tui"
description = "First-class terminal interface for GTA Claw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
claw-gateway-client.workspace = true
claw-protocol.workspace = true
claw-security.workspace = true
crossterm = "=0.29.0"
rand_core = "=0.10.1"
ring = "=0.17.14"
secrecy = "=0.10.3"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "=2.5.8"

[dev-dependencies]
base64 = "=0.22.1"
fastwebsockets = { version = "=0.10.0", default-features = false, features = ["unstable-split"] }
httparse = "=1.10.1"
sha1 = "=0.11.0"
tokio-util = { version = "=0.7.19", features = ["rt"] }

[lints]
workspace = true
