[package]
name = "gta-claw-cli"
description = "Headless command-line adapter for GTA Claw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
age = { version = "=0.12.1", default-features = false }
claw-application = { workspace = true, features = ["runtime-ports"] }
claw-config.workspace = true
claw-gateway-client.workspace = true
claw-mcp.workspace = true
claw-migrate.workspace = true
claw-observability.workspace = true
claw-platform = { workspace = true, features = ["native-identity", "native-config"] }
claw-protocol.workspace = true
claw-provider-sdk.workspace = true
claw-security.workspace = true
claw-state.workspace = true
claw-tools.workspace = true
rand_core = "=0.10.1"
ring = "=0.17.14"
secrecy = "=0.10.3"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
url = "=2.5.8"
zeroize = "=1.9.0"

[dev-dependencies]
base64 = "=0.22.1"
claw-conformance.workspace = true
fastwebsockets = { version = "=0.10.0", default-features = false, features = ["unstable-split"] }
httparse = "=1.10.1"
os_pipe = "=1.2.3"
sha1 = "=0.11.0"

[lints]
workspace = true
