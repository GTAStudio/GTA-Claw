[package]
name = "gta-claw-cli"
description = "Headless command-line adapter for GTA Claw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
claw-application.workspace = true
claw-gateway-client.workspace = true
claw-platform.workspace = true
claw-protocol.workspace = true
claw-security.workspace = true
rand_core = "=0.10.1"
ring = "=0.17.14"
secrecy = "=0.10.3"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.52.3", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
url = "=2.5.8"
zeroize = "=1.9.0"

[dev-dependencies]
base64 = "=0.22.1"
fastwebsockets = { version = "=0.10.0", default-features = false, features = ["unstable-split"] }
httparse = "=1.10.1"
sha1 = "=0.11.0"
tokio-util = { version = "=0.7.18", features = ["rt"] }

[lints]
workspace = true
