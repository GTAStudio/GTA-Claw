[package]
name = "gta-claw-daemon"
description = "Headless GTA Claw daemon entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "=0.8.9", features = ["json", "tokio"] }
claw-application.workspace = true
claw-config.workspace = true
claw-http-api.workspace = true
claw-platform.workspace = true
claw-protocol.workspace = true
claw-security.workspace = true
serde_json.workspace = true
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }

[lints]
workspace = true
