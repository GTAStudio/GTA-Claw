[package]
name = "gta-claw-daemon"
description = "Headless GTA Claw daemon entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "=0.8.9", features = ["json", "tokio"] }
claw-application = { workspace = true, features = ["composition"] }
claw-channels.workspace = true
claw-config.workspace = true
claw-crestodian.workspace = true
claw-domain.workspace = true
claw-gateway.workspace = true
claw-http-api.workspace = true
claw-observability.workspace = true
claw-platform.workspace = true
claw-protocol.workspace = true
claw-provider-sdk.workspace = true
claw-providers.workspace = true
claw-security.workspace = true
claw-skills.workspace = true
futures-util = { version = "=0.3.33", default-features = false, features = ["std"] }
json5 = "1.3.1"
secrecy = "=0.10.3"
serde_json.workspace = true
tokio = { version = "=1.53.1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tracing = "=0.1.44"
url = "=2.5.8"

[lints]
workspace = true
