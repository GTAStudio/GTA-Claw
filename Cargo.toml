[workspace]
members = [
  "apps/gta-claw-android",
  "apps/gta-claw-cli",
  "apps/gta-claw-daemon",
  "apps/gta-claw-ios",
  "apps/gta-claw-tui",
  "apps/gta-claw-updater",
  "crates/claw-acp",
  "crates/claw-application",
  "crates/claw-channel-sdk",
  "crates/claw-channels",
  "crates/claw-clients",
  "crates/claw-config",
  "crates/claw-conformance",
  "crates/claw-crestodian",
  "crates/claw-discovery",
  "crates/claw-domain",
  "crates/claw-gateway",
  "crates/claw-gateway-client",
  "crates/claw-goals",
  "crates/claw-http-api",
  "crates/claw-mcp",
  "crates/claw-memory",
  "crates/claw-migrate",
  "crates/claw-observability",
  "crates/claw-platform",
  "crates/claw-plugin-api",
  "crates/claw-plugin-host",
  "crates/claw-protocol",
  "crates/claw-provider-sdk",
  "crates/claw-providers",
  "crates/claw-relay",
  "crates/claw-repo-policy",
  "crates/claw-runtime",
  "crates/claw-security",
  "crates/claw-skills",
  "crates/claw-tools",
  "crates/claw-worker",
]
exclude = ["android", "desktop", "ios"]
resolver = "3"

[workspace.dependencies]
claw-acp = { path = "crates/claw-acp", version = "0.1.0" }
claw-application = { path = "crates/claw-application", version = "0.1.0" }
claw-channel-sdk = { path = "crates/claw-channel-sdk", version = "0.1.0" }
claw-channels = { path = "crates/claw-channels", version = "0.1.0" }
claw-clients = { path = "crates/claw-clients", version = "0.1.0" }
claw-config = { path = "crates/claw-config", version = "0.1.0" }
claw-conformance = { path = "crates/claw-conformance", version = "0.1.0" }
claw-crestodian = { path = "crates/claw-crestodian", version = "0.1.0" }
claw-discovery = { path = "crates/claw-discovery", version = "0.1.0" }
claw-domain = { path = "crates/claw-domain", version = "0.1.0" }
claw-gateway = { path = "crates/claw-gateway", version = "0.1.0" }
claw-gateway-client = { path = "crates/claw-gateway-client", version = "0.1.0" }
claw-goals = { path = "crates/claw-goals", version = "0.1.0" }
claw-http-api = { path = "crates/claw-http-api", version = "0.1.0" }
claw-mcp = { path = "crates/claw-mcp", version = "0.1.0" }
claw-memory = { path = "crates/claw-memory", version = "0.1.0" }
claw-migrate = { path = "crates/claw-migrate", version = "0.1.0" }
claw-observability = { path = "crates/claw-observability", version = "0.1.0" }
claw-platform = { path = "crates/claw-platform", version = "0.1.0" }
claw-plugin-api = { path = "crates/claw-plugin-api", version = "0.1.0" }
claw-plugin-host = { path = "crates/claw-plugin-host", version = "0.1.0" }
claw-protocol = { path = "crates/claw-protocol", version = "0.1.0" }
claw-provider-sdk = { path = "crates/claw-provider-sdk", version = "0.1.0" }
claw-providers = { path = "crates/claw-providers", version = "0.1.0" }
claw-relay = { path = "crates/claw-relay", version = "0.1.0" }
claw-runtime = { path = "crates/claw-runtime", version = "0.1.0" }
claw-security = { path = "crates/claw-security", version = "0.1.0" }
claw-skills = { path = "crates/claw-skills", version = "0.1.0" }
claw-tools = { path = "crates/claw-tools", version = "0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
# `preserve_order` is not optional: `agent-client-protocol-schema` requires it,
# and Cargo unifies features across the workspace. Declaring it here makes the
# resulting `serde_json::Map` ordering (insertion order, not sorted) identical
# whether a crate is built alone with `-p` or as part of the whole workspace.
# Leaving it implicit meant `cargo test -p claw-mcp` and `cargo test --workspace`
# disagreed about serialized key order.
serde_json = { version = "=1.0.151", features = ["preserve_order", "raw_value"] }
serde_path_to_error = "=0.1.20"
sha2 = "=0.11.0"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
repository = "https://github.com/GTAStudio/GTA-Claw"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "warn"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# `unreachable_pub` (enabled above) and `redundant_pub_crate` are mutually
# contradictory: satisfying either one re-triggers the other. The rustc lint is
# the one that describes the intended visibility discipline, so it wins.
redundant_pub_crate = "allow"
# The frozen contract tables, wire inventories and golden fixtures are long by
# construction. Splitting them to satisfy a line count would scatter one
# contract across several functions and make the evidence harder to audit.
too_many_lines = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
# A panic in a supervised daemon must unwind so the surrounding task boundary can
# report it; `panic = "abort"` would turn one poisoned request into a lost node.
panic = "unwind"

[profile.dev]
# Backtraces and debugger line numbers without the multi-gigabyte DWARF blobs a
# 37-crate workspace otherwise produces.
debug = "line-tables-only"

[profile.dev.package."*"]
# Third-party code is not being debugged, so optimise it once and keep the fast
# edit-compile-test loop for first-party crates.
opt-level = 2
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 2
debug = false

[profile.bench]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
