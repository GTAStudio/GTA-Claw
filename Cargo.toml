[workspace]
members = [
  "apps/gta-claw-android",
  "apps/gta-claw-cli",
  "apps/gta-claw-daemon",
  "apps/gta-claw-ios",
  "crates/claw-application",
  "crates/claw-channel-sdk",
  "crates/claw-channels",
  "crates/claw-clients",
  "crates/claw-config",
  "crates/claw-conformance",
  "crates/claw-crestodian",
  "crates/claw-domain",
  "crates/claw-gateway",
  "crates/claw-gateway-client",
  "crates/claw-http-api",
  "crates/claw-memory",
  "crates/claw-observability",
  "crates/claw-platform",
  "crates/claw-plugin-api",
  "crates/claw-plugin-host",
  "crates/claw-protocol",
  "crates/claw-provider-sdk",
  "crates/claw-providers",
  "crates/claw-relay",
  "crates/claw-repo-policy",
  "crates/claw-security",
  "crates/claw-skills",
  "crates/claw-sqlite-file-control",
  "crates/claw-state",
  "crates/claw-tools",
]
exclude = ["android", "desktop", "ios"]
resolver = "3"

[workspace.dependencies]
claw-application = { path = "crates/claw-application", version = "0.1.0" }
claw-channel-sdk = { path = "crates/claw-channel-sdk", version = "0.1.0" }
claw-channels = { path = "crates/claw-channels", version = "0.1.0" }
claw-clients = { path = "crates/claw-clients", version = "0.1.0" }
claw-config = { path = "crates/claw-config", version = "0.1.0" }
claw-conformance = { path = "crates/claw-conformance", version = "0.1.0" }
claw-crestodian = { path = "crates/claw-crestodian", version = "0.1.0" }
claw-domain = { path = "crates/claw-domain", version = "0.1.0" }
claw-gateway = { path = "crates/claw-gateway", version = "0.1.0" }
claw-gateway-client = { path = "crates/claw-gateway-client", version = "0.1.0" }
claw-http-api = { path = "crates/claw-http-api", version = "0.1.0" }
claw-memory = { path = "crates/claw-memory", version = "0.1.0" }
claw-observability = { path = "crates/claw-observability", version = "0.1.0" }
claw-platform = { path = "crates/claw-platform", version = "0.1.0" }
claw-plugin-api = { path = "crates/claw-plugin-api", version = "0.1.0" }
claw-plugin-host = { path = "crates/claw-plugin-host", version = "0.1.0" }
claw-protocol = { path = "crates/claw-protocol", version = "0.1.0" }
claw-provider-sdk = { path = "crates/claw-provider-sdk", version = "0.1.0" }
claw-providers = { path = "crates/claw-providers", version = "0.1.0" }
claw-relay = { path = "crates/claw-relay", version = "0.1.0" }
claw-security = { path = "crates/claw-security", version = "0.1.0" }
claw-skills = { path = "crates/claw-skills", version = "0.1.0" }
claw-sqlite-file-control = { path = "crates/claw-sqlite-file-control", version = "0.1.0" }
claw-state = { path = "crates/claw-state", version = "0.1.0" }
claw-tools = { path = "crates/claw-tools", version = "0.1.0" }
getrandom = "=0.2.17"
rustix = { version = "1.1.4", features = ["fs", "process"] }
same-file = "1.0.6"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["raw_value"] }
serde_path_to_error = "=0.1.20"
sha2 = "=0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
xattr = "1.6.1"
uzers = "0.12.2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
repository = "https://github.com/GTAStudio/GTA-Claw"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
