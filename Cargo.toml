[workspace]
members = [
  "apps/gta-claw-cli",
  "apps/gta-claw-daemon",
  "crates/claw-application",
  "crates/claw-domain",
  "crates/claw-platform",
  "crates/claw-protocol",
]
exclude = ["desktop"]
resolver = "3"

[workspace.dependencies]
claw-application = { path = "crates/claw-application", version = "0.1.0" }
claw-domain = { path = "crates/claw-domain", version = "0.1.0" }
claw-platform = { path = "crates/claw-platform", version = "0.1.0" }
claw-protocol = { path = "crates/claw-protocol", version = "0.1.0" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["raw_value"] }
serde_path_to_error = "=0.1.20"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
repository = "https://github.com/GTAStudio/GTA-Claw"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
