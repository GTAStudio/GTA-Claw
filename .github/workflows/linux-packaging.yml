name: Linux headless packaging prototype

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/linux-packaging.yml"
      - "packaging/linux/**"
      - "apps/**"
      - "crates/**"
      - "compat/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  pull_request:
    paths:
      - ".github/workflows/linux-packaging.yml"
      - "packaging/linux/**"
      - "apps/**"
      - "crates/**"
      - "compat/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  source-policy:
    name: Source policy and shell security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without credential persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install native policy tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils gcc jq patchelf python3 rpm shellcheck
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" |
            sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint

      - name: Enforce focused source ownership
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACDMRT "$BASE_SHA...$GITHUB_SHA" |
            while IFS= read -r path; do
              case "$path" in
                packaging/linux/* | .github/workflows/linux-packaging.yml) ;;
                *)
                  echo "P04d changed a path outside its ownership: $path" >&2
                  exit 1
                  ;;
              esac
            done

      - name: Check shell, workflow, source, and release policy
        shell: bash
        run: |
          set -euo pipefail
          find packaging/linux -type f -name '*.sh' -print0 |
            while IFS= read -r -d '' script; do
              bash -n "$script"
              # Every sourced script is checked independently; jq/awk programs
              # intentionally use single quotes to prevent shell expansion.
              shellcheck -x -e SC1091,SC2016 "$script"
            done
          find packaging/linux -type f -name '*.py' -print0 |
            while IFS= read -r -d '' script; do
              python3 -c 'import sys; path = sys.argv[1]; compile(open(path, encoding="utf-8").read(), path, "exec")' "$script"
            done
          actionlint .github/workflows/linux-packaging.yml
          ./packaging/linux/workflow-self-test.sh
          ./packaging/linux/self-test.sh
          python3 packaging/linux/safeio.py \
            run-create linux-safeio-self-test -- \
            ./packaging/linux/safeio-self-test.sh

      - name: Preserve root Linux metadata and desktop rejection
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 |
            jq -e '
              [.packages[].name |
                select(. == "slint" or . == "slint-build" or startswith("i-slint"))
              ] | length == 0
            '
          cargo metadata \
            --manifest-path desktop/Cargo.toml \
            --locked \
            --format-version 1 \
            --filter-platform x86_64-unknown-linux-gnu |
            jq -e '
              [.packages[].name |
                select(. == "slint" or . == "slint-build" or startswith("i-slint"))
              ] | length == 0
            '
          set +e
          desktop_output="$(
            cargo check \
              --manifest-path desktop/Cargo.toml \
              --package gta-claw-desktop \
              --locked 2>&1
          )"
          desktop_status=$?
          set -e
          printf '%s\n' "$desktop_output"
          test "$desktop_status" -ne 0
          grep -F "gta-claw-desktop supports only Windows and macOS" \
            <<<"$desktop_output"

  rust-supply-chain:
    name: Root Rust, MSRV, deny, and audit
    needs: source-policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Format, check, lint, and test root workspace
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked

      - name: Check root workspace at MSRV
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 check --workspace --all-targets --locked

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87
        with:
          arguments: --all-features
          command: check
          manifest-path: ./Cargo.toml

      - name: Audit advisories
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  native-x86:
    name: Native x86_64 runtime and packages
    needs: source-policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install native package inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils cpio jq python3 rpm

      - name: Build twice in pinned Bookworm with different umasks
        id: build
        shell: bash
        run: |
          set -euo pipefail
          first_build="$(
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/linux-x86-build-umask000" \
            BUILD_INPUT_UMASK=000 \
              ./packaging/linux/build-container.sh x86_64
          )"
          second_build="$(
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/linux-x86-build-umask002" \
            BUILD_INPUT_UMASK=002 \
              ./packaging/linux/build-container.sh x86_64
          )"
          first_manifest="${first_build%%|*}"
          first_key_sha="${first_build##*|}"
          second_manifest="${second_build%%|*}"
          second_key_sha="${second_build##*|}"
          first_cli="$(jq -er '.binaries[] | select(.name == "gta-claw-cli") | .path' "$first_manifest")"
          second_cli="$(jq -er '.binaries[] | select(.name == "gta-claw-cli") | .path' "$second_manifest")"
          first_daemon="$(jq -er '.binaries[] | select(.name == "gta-claw-daemon") | .path' "$first_manifest")"
          second_daemon="$(jq -er '.binaries[] | select(.name == "gta-claw-daemon") | .path' "$second_manifest")"
          cmp -s "$(dirname "$first_manifest")/$first_cli" "$(dirname "$second_manifest")/$second_cli"
          cmp -s "$(dirname "$first_manifest")/$first_daemon" "$(dirname "$second_manifest")/$second_daemon"
          {
            echo "first-manifest=$first_manifest"
            echo "first-key-sha=$first_key_sha"
            echo "second-manifest=$second_manifest"
            echo "second-key-sha=$second_key_sha"
          } >>"$GITHUB_OUTPUT"

      - name: Execute binaries on the pinned oldest supported environment
        shell: bash
        env:
          BUILD_MANIFEST: ${{ steps.build.outputs.first-manifest }}
        run: |
          set -euo pipefail
          build_root="$(dirname "$BUILD_MANIFEST")"
          relative_root="${build_root#"$GITHUB_WORKSPACE/target/"}"
          cli="$(jq -er '.binaries[] | select(.name == "gta-claw-cli") | .path' "$BUILD_MANIFEST")"
          daemon="$(jq -er '.binaries[] | select(.name == "gta-claw-daemon") | .path' "$BUILD_MANIFEST")"
          image='gta-claw-linux-build:rust-1.97.0-bookworm'
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$GITHUB_WORKSPACE/target:/workspace/target:ro" \
            "$image" \
            "/workspace/target/$relative_root/$cli" health |
            grep -F 'healthy runtime='
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$GITHUB_WORKSPACE/target:/workspace/target:ro" \
            "$image" \
            "/workspace/target/$relative_root/$daemon" --probe |
            grep -F 'healthy runtime='

      - name: Reject forged build manifests and substituted binaries
        shell: bash
        run: |
          OUTPUT_ROOT="$GITHUB_WORKSPACE/target/linux-build-manifest-self-test" \
            ./packaging/linux/build-manifest-self-test-container.sh \
              x86_64 \
              "${{ steps.build.outputs.first-manifest }}" \
              "${{ steps.build.outputs.first-key-sha }}"

      - name: Package independent builds and prove deterministic outputs
        id: package
        shell: bash
        run: |
          set -euo pipefail
          first="$GITHUB_WORKSPACE/target/linux-x86_64-run1"
          second="$GITHUB_WORKSPACE/target/linux-x86_64-run2"
          upgrade="$GITHUB_WORKSPACE/target/linux-x86_64-upgrade"
          umask 000
          PACKAGE_RELEASE=1 OUTPUT_ROOT="$first" \
            ./packaging/linux/package-container.sh \
              x86_64 \
              "${{ steps.build.outputs.first-manifest }}" \
              "${{ steps.build.outputs.first-key-sha }}"
          umask 002
          PACKAGE_RELEASE=1 OUTPUT_ROOT="$second" \
            ./packaging/linux/package-container.sh \
              x86_64 \
              "${{ steps.build.outputs.second-manifest }}" \
              "${{ steps.build.outputs.second-key-sha }}"
          diff \
            <(cd "$first/artifacts" && find . -type f -print | LC_ALL=C sort) \
            <(cd "$second/artifacts" && find . -type f -print | LC_ALL=C sort)
          while IFS= read -r relative; do
            cmp -s "$first/artifacts/$relative" "$second/artifacts/$relative"
          done < <(cd "$first/artifacts" && find . -type f -printf '%P\n' | LC_ALL=C sort)
          PACKAGE_RELEASE=2 OUTPUT_ROOT="$upgrade" \
            ./packaging/linux/package-container.sh \
              x86_64 \
              "${{ steps.build.outputs.first-manifest }}" \
              "${{ steps.build.outputs.first-key-sha }}"
          echo "release1=$first" >>"$GITHUB_OUTPUT"
          echo "release2=$upgrade" >>"$GITHUB_OUTPUT"

      - name: Mutate every published OCI trust edge
        shell: bash
        run: |
          OUTPUT_ROOT="$GITHUB_WORKSPACE/target/linux-oci-mutation-tests" \
            ./packaging/linux/oci-self-test-container.sh \
            x86_64 \
            "${{ steps.package.outputs.release1 }}/artifacts/gta-claw-0.1.0-linux-x86_64.oci.tar.gz" \
            "${{ steps.build.outputs.first-manifest }}" \
            "${{ steps.build.outputs.first-key-sha }}"

      - name: Install and execute Debian package on pinned Bookworm
        shell: bash
        run: |
          set -euo pipefail
          package="${{ steps.package.outputs.release1 }}/artifacts/gta-claw_0.1.0-1_amd64.deb"
          docker run --rm \
            --cap-drop ALL \
            --volume "$package:/tmp/gta-claw.deb:ro" \
            debian:bookworm-slim@sha256:60eac759739651111db372c07be67863818726f754804b8707c90979bda511df \
            bash -c '
              set -euo pipefail
              for forbidden in gcc cargo rustc rpm make; do
                if command -v "$forbidden" >/dev/null 2>&1; then
                  echo "minimal resolver image unexpectedly contains $forbidden" >&2
                  exit 1
                fi
              done
              printf "%s\n" \
                "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260701T000000Z bookworm main" \
                > /etc/apt/sources.list
              rm -f /etc/apt/sources.list.d/*
              apt-get -o Acquire::Check-Valid-Until=false update
              apt-get -o Acquire::Check-Valid-Until=false install --no-install-recommends -y \
                /tmp/gta-claw.deb
              /usr/bin/gta-claw-cli health | grep -F "healthy runtime="
              /usr/libexec/gta-claw/gta-claw-daemon --probe | grep -F "healthy runtime="
              apt-get remove -y gta-claw
              test ! -e /usr/libexec/gta-claw/gta-claw-daemon
            '

      - name: Verify systemd unit with packaged executable
        shell: bash
        run: |
          set -euo pipefail
          manifest="${{ steps.build.outputs.first-manifest }}"
          build_root="$(dirname "$manifest")"
          daemon="$(jq -er '.binaries[] | select(.name == "gta-claw-daemon") | .path' "$manifest")"
          sudo install -D -m 0755 \
            "$build_root/$daemon" \
            /usr/libexec/gta-claw/gta-claw-daemon
          systemd-analyze verify packaging/linux/systemd/gta-claw-daemon.service
          systemd-analyze security --offline=yes \
            packaging/linux/systemd/gta-claw-daemon.service |
            tee "$RUNNER_TEMP/systemd-security.txt"
          grep -F 'NoNewPrivileges=' "$RUNNER_TEMP/systemd-security.txt"
          sudo rm -f /usr/libexec/gta-claw/gta-claw-daemon

      - name: Prove real Debian and RPM lifecycle
        shell: bash
        run: |
          ./packaging/linux/lifecycle-test.sh \
            "${{ steps.package.outputs.release1 }}/artifacts/gta-claw_0.1.0-1_amd64.deb" \
            "${{ steps.package.outputs.release2 }}/artifacts/gta-claw_0.1.0-2_amd64.deb" \
            "${{ steps.package.outputs.release1 }}/artifacts/gta-claw-0.1.0-1.x86_64.rpm" \
            "${{ steps.package.outputs.release2 }}/artifacts/gta-claw-0.1.0-2.x86_64.rpm"

      - name: Prove release and publication stay disabled
        shell: bash
        run: |
          set -euo pipefail
          if RELEASE_MODE=0 ./packaging/linux/release.sh sign; then
            echo "signing unexpectedly succeeded outside release mode" >&2
            exit 1
          fi
          if RELEASE_MODE=0 ./packaging/linux/release.sh publish; then
            echo "publication unexpectedly succeeded outside release mode" >&2
            exit 1
          fi

      - name: Upload short-lived x86_64 prototype artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-x86_64-prototype-${{ github.sha }}
          path: target/linux-x86_64-run1/artifacts/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  cross-arm64:
    name: Cross-built arm64 layouts
    needs: source-policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install arm64 cross and native package tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils cpio jq python3 rpm

      - name: Cross-build arm64 twice in pinned Bookworm
        id: build
        shell: bash
        run: |
          set -euo pipefail
          first_build="$(
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/linux-arm64-build-umask000" \
            BUILD_INPUT_UMASK=000 \
              ./packaging/linux/build-container.sh arm64
          )"
          second_build="$(
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/linux-arm64-build-umask002" \
            BUILD_INPUT_UMASK=002 \
              ./packaging/linux/build-container.sh arm64
          )"
          first_manifest="${first_build%%|*}"
          first_key_sha="${first_build##*|}"
          second_manifest="${second_build%%|*}"
          second_key_sha="${second_build##*|}"
          for manifest in "$first_manifest" "$second_manifest"; do
            root="$(dirname "$manifest")"
            cli="$(jq -er '.binaries[] | select(.name == "gta-claw-cli") | .path' "$manifest")"
            daemon="$(jq -er '.binaries[] | select(.name == "gta-claw-daemon") | .path' "$manifest")"
            readelf -h "$root/$cli" | grep -F 'AArch64'
            readelf -h "$root/$daemon" | grep -F 'AArch64'
          done
          {
            echo "first-manifest=$first_manifest"
            echo "first-key-sha=$first_key_sha"
            echo "second-manifest=$second_manifest"
            echo "second-key-sha=$second_key_sha"
          } >>"$GITHUB_OUTPUT"

      - name: Package twice and prove deterministic arm64 layouts
        shell: bash
        run: |
          set -euo pipefail
          first="$GITHUB_WORKSPACE/target/linux-arm64-run1"
          second="$GITHUB_WORKSPACE/target/linux-arm64-run2"
          umask 000
          OUTPUT_ROOT="$first" \
            ./packaging/linux/package-container.sh \
              arm64 \
              "${{ steps.build.outputs.first-manifest }}" \
              "${{ steps.build.outputs.first-key-sha }}"
          umask 002
          OUTPUT_ROOT="$second" \
            ./packaging/linux/package-container.sh \
              arm64 \
              "${{ steps.build.outputs.second-manifest }}" \
              "${{ steps.build.outputs.second-key-sha }}"
          diff \
            <(cd "$first/artifacts" && find . -type f -print | LC_ALL=C sort) \
            <(cd "$second/artifacts" && find . -type f -print | LC_ALL=C sort)
          while IFS= read -r relative; do
            cmp -s "$first/artifacts/$relative" "$second/artifacts/$relative"
          done < <(cd "$first/artifacts" && find . -type f -printf '%P\n' | LC_ALL=C sort)
          echo "arm64 proof covers build and package/OCI layout only; no runtime execution was attempted."

      - name: Upload short-lived arm64 prototype artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-arm64-prototype-${{ github.sha }}
          path: target/linux-arm64-run1/artifacts/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
