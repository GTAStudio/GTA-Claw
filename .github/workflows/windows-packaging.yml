name: Windows release packaging

on:
  pull_request:
    paths:
      - ".github/workflows/windows-packaging.yml"
      - ".github/workflows/joint-release-finalize.yml"
      - "packaging/windows/**"
      - "packaging/macos/spdx-tools-requirements.txt"
      - "apps/**"
      - "crates/**"
      - "desktop/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:
    inputs:
      release:
        description: Build protected signed release artifacts
        required: true
        type: boolean
        default: false
      release_commit:
        description: Full immutable commit SHA selected by the annotated release tag
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  WIX_MSI_SHA256: a8a5cc7443353cef3ab900c60cd7a3a5ee601746319d104ac7b12ad0ced2345c
  WIX_VERSION: 6.0.2

jobs:
  validate:
    name: Source and packaging policy
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run frozen surface and packaging self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\packaging\windows\validate-release-surfaces.ps1
          .\packaging\windows\self-test.ps1

  package:
    name: Unsigned non-release ${{ matrix.arch }}
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Require architecture toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup target add '${{ matrix.target }}'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $component = 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          if ('${{ matrix.arch }}' -eq 'arm64') {
            $component = 'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
          }
          $installation = & $vswhere -latest -products '*' -requires $component -property installationPath
          if ([string]::IsNullOrWhiteSpace($installation)) {
            throw "Required MSVC component is unavailable: $component"
          }

      - name: Provision pinned WiX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'wix'
          $msi = Join-Path $toolRoot "wix-cli-x64-$env:WIX_VERSION.msi"
          $admin = Join-Path $toolRoot 'admin'
          New-Item -ItemType Directory -Force -Path $toolRoot,$admin | Out-Null
          curl.exe -L --fail --silent --show-error `
            -o $msi "https://github.com/wixtoolset/wix/releases/download/v$env:WIX_VERSION/wix-cli-x64.msi"
          if ((Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:WIX_MSI_SHA256) {
            throw 'Pinned WiX MSI checksum mismatch.'
          }
          $process = Start-Process msiexec.exe -ArgumentList @(
            '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$admin`""
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "WiX administrative extraction failed: $($process.ExitCode)"
          }
          $wix = (Get-ChildItem $admin -File -Recurse -Filter wix.exe | Select-Object -First 1).FullName
          & $wix --version
          "GTA_CLAW_WIX=$wix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Acquire locked Cargo dependencies
        shell: pwsh
        run: |
          cargo fetch --manifest-path Cargo.toml --locked
          cargo fetch --manifest-path desktop\Cargo.toml --locked

      - name: Build and inspect published package bytes offline
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\cargo-target
          TMP: ${{ runner.temp }}\gta-claw-tmp
          TEMP: ${{ runner.temp }}\gta-claw-tmp
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:CARGO_TARGET_DIR,$env:TMP | Out-Null
          .\packaging\windows\package.ps1 -Architecture '${{ matrix.arch }}'
          .\packaging\windows\validate-artifacts.ps1 `
            -ArtifactDirectory "packaging\windows\out\${{ matrix.arch }}"

      - name: Upload explicit unsigned non-release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-non-release-windows-${{ matrix.arch }}
          path: |
            packaging/windows/out/${{ matrix.arch }}/*.zip
            packaging/windows/out/${{ matrix.arch }}/*.msix
            packaging/windows/out/${{ matrix.arch }}/*.msi
            packaging/windows/out/${{ matrix.arch }}/*.sha256
            packaging/windows/out/${{ matrix.arch }}/*.spdx.json
            packaging/windows/out/${{ matrix.arch }}/*.provenance.json
            packaging/windows/out/${{ matrix.arch }}/SHA256SUMS
            packaging/windows/out/${{ matrix.arch }}/artifacts.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  bundle:
    name: Unsigned non-release MSIXBundle
    needs: package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Acquire locked Cargo dependencies
        shell: pwsh
        run: |
          cargo fetch --manifest-path Cargo.toml --locked
          cargo fetch --manifest-path desktop\Cargo.toml --locked

      - name: Download x64 and arm64 MSIX packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: unsigned-non-release-windows-*
          path: ${{ runner.temp }}/windows-inputs

      - name: Assemble and inspect published bundle bytes
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\cargo-target
          TMP: ${{ runner.temp }}\gta-claw-tmp
          TEMP: ${{ runner.temp }}\gta-claw-tmp
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:CARGO_TARGET_DIR,$env:TMP | Out-Null
          $x64 = @(Get-ChildItem $env:RUNNER_TEMP\windows-inputs -File -Recurse -Filter '*windows-x64-unsigned-non-release.msix')
          $arm64 = @(Get-ChildItem $env:RUNNER_TEMP\windows-inputs -File -Recurse -Filter '*windows-arm64-unsigned-non-release.msix')
          if ($x64.Count -ne 1 -or $arm64.Count -ne 1) {
            throw 'Expected exactly one unsigned MSIX for each Windows architecture.'
          }
          .\packaging\windows\bundle.ps1 -X64Msix $x64[0].FullName -Arm64Msix $arm64[0].FullName
          .\packaging\windows\validate-artifacts.ps1 `
            -ArtifactDirectory packaging\windows\out\bundle

      - name: Upload explicit unsigned non-release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-non-release-windows-msixbundle
          path: |
            packaging/windows/out/bundle/*.msixbundle
            packaging/windows/out/bundle/*.sha256
            packaging/windows/out/bundle/*.spdx.json
            packaging/windows/out/bundle/*.provenance.json
            packaging/windows/out/bundle/SHA256SUMS
            packaging/windows/out/bundle/artifacts.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Protected signed Windows release
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    needs: validate
    runs-on: windows-latest
    environment: windows-release
    concurrency:
      group: windows-desktop-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      release-sha: ${{ steps.policy.outputs.release-sha }}
      tag-object: ${{ steps.policy.outputs.tag-object }}
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce immutable semantic release tag
        id: policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -notmatch '^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$') {
            throw 'Signed Windows release requires a semantic vX.Y.Z tag.'
          }
          $version = $Matches[1]
          if ((git cat-file -t $env:GITHUB_REF) -ne 'tag') {
            throw 'Signed Windows release requires an annotated tag.'
          }
          if ((git rev-parse "$env:GITHUB_REF^{commit}") -ne $env:GITHUB_SHA) {
            throw 'Release tag does not resolve to the immutable workflow commit.'
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release commit is not reachable from protected main.'
          }
          Import-Module .\packaging\windows\WindowsPackaging.psm1 -Force
          if ((Get-CanonicalVersion $PWD).Cargo -ne $version) {
            throw 'Release tag version does not match the Cargo workspace version.'
          }
          "release-sha=$env:GITHUB_SHA" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag-object=$(git rev-parse $env:GITHUB_REF)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up pinned Python for official SPDX validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install checksum-pinned official SPDX validator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'gta-claw-spdx-tools'
          python -m venv $root
          $python = Join-Path $root 'Scripts\python.exe'
          & $python -m pip install `
            --disable-pip-version-check `
            --only-binary=:all: `
            --require-hashes `
            --requirement packaging\macos\spdx-tools-requirements.txt
          $validator = Join-Path $root 'Scripts\pyspdxtools.exe'
          if (-not (Test-Path -LiteralPath $validator -PathType Leaf)) {
            throw 'Official SPDX validator installation is incomplete.'
          }
          $spdxVersion = & $python -c 'import importlib.metadata; print(importlib.metadata.version("spdx-tools"))'
          if ($spdxVersion -ne '0.8.3') {
            throw "Unexpected SPDX validator version: $spdxVersion"
          }
          "SPDX_VALIDATOR=$validator" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Require both Windows architecture toolchains
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          foreach ($component in @(
            'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
            'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
          )) {
            $installation = & $vswhere -latest -products '*' -requires $component -property installationPath
            if ([string]::IsNullOrWhiteSpace($installation)) {
              throw "Required MSVC component is unavailable: $component"
            }
          }

      - name: Provision pinned WiX and acquire locked Cargo dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'wix'
          $msi = Join-Path $toolRoot "wix-cli-x64-$env:WIX_VERSION.msi"
          $admin = Join-Path $toolRoot 'admin'
          New-Item -ItemType Directory -Force -Path $toolRoot,$admin | Out-Null
          curl.exe -L --fail --silent --show-error `
            -o $msi "https://github.com/wixtoolset/wix/releases/download/v$env:WIX_VERSION/wix-cli-x64.msi"
          if ((Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:WIX_MSI_SHA256) {
            throw 'Pinned WiX MSI checksum mismatch.'
          }
          $process = Start-Process msiexec.exe -ArgumentList @(
            '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$admin`""
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "WiX administrative extraction failed: $($process.ExitCode)"
          }
          $wix = (Get-ChildItem $admin -File -Recurse -Filter wix.exe | Select-Object -First 1).FullName
          & $wix --version
          "GTA_CLAW_WIX=$wix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cargo fetch --manifest-path Cargo.toml --locked
          cargo fetch --manifest-path desktop\Cargo.toml --locked

      - name: Build and freeze reviewed production-identity candidates offline
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\cargo-target
          EXPECTED_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          TMP: ${{ runner.temp }}\gta-claw-tmp
          TEMP: ${{ runner.temp }}\gta-claw-tmp
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_PUBLISHER -notmatch '^CN=[^<>&"]+$') {
            throw 'WINDOWS_SIGNING_PUBLISHER must be a protected certificate subject.'
          }
          New-Item -ItemType Directory -Force -Path $env:CARGO_TARGET_DIR,$env:TMP | Out-Null
          .\packaging\windows\package.ps1 `
            -Architecture x64 `
            -ReleaseMode `
            -Publisher $env:EXPECTED_PUBLISHER
          .\packaging\windows\package.ps1 `
            -Architecture arm64 `
            -ReleaseMode `
            -Publisher $env:EXPECTED_PUBLISHER `
            -SkipMsi
          $candidates = @(
            Get-ChildItem packaging\windows\out\x64 -File |
              Where-Object { $_.Name -match '-release-candidate-unsigned\.(zip|msix|msi)$' }
            Get-ChildItem packaging\windows\out\arm64 -File |
              Where-Object { $_.Name -match '-release-candidate-unsigned\.(zip|msix)$' }
          )
          if ($candidates.Count -ne 7) {
            throw "Reviewed signing input set must contain exactly seven packages and portable archives, found $($candidates.Count)."
          }
          $ledger = @($candidates | Sort-Object Name | ForEach-Object {
            [ordered]@{
              name = $_.Name
              path = $_.FullName
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $ledgerPath = Join-Path $env:RUNNER_TEMP 'windows-signing-inputs.json'
          [IO.File]::WriteAllText(
            $ledgerPath,
            (($ledger | ConvertTo-Json -Depth 4 -Compress) + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          "SIGNING_INPUT_MANIFEST=$ledgerPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Revalidate immutable tag and reviewed bytes before signing
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$' -or
              $env:RELEASE_COMMIT -ne $env:GITHUB_SHA) {
            throw 'release_commit must equal the immutable workflow commit.'
          }
          $tagObject = git rev-parse $env:GITHUB_REF
          $remoteTag = @(git ls-remote --exit-code origin $env:GITHUB_REF)
          if ($LASTEXITCODE -ne 0 -or $remoteTag.Count -ne 1 -or
              (($remoteTag[0] -split '\s+')[0]) -ne $tagObject) {
            throw 'Remote annotated release tag changed before signing.'
          }
          $ledger = @(Get-Content $env:SIGNING_INPUT_MANIFEST -Raw | ConvertFrom-Json)
          if ($ledger.Count -ne 7) {
            throw 'Reviewed signing input ledger is incomplete.'
          }
          foreach ($entry in $ledger) {
            if (-not (Test-Path -LiteralPath $entry.path -PathType Leaf)) {
              throw "Reviewed signing input disappeared: $($entry.name)"
            }
            $actual = (Get-FileHash $entry.path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $entry.sha256) {
              throw "Reviewed signing input changed: $($entry.name)"
            }
          }

      - name: Import protected package signing identity
        id: package-signing
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Protected Windows signing credentials are unavailable.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'gta-claw-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          try {
            $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate `
              -FilePath $pfx `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $secure `
              -Exportable:$false
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          if ($null -ne $certificate -and
              $certificate.Thumbprint -match '^[0-9A-Fa-f]{40}$') {
            "thumbprint=$($certificate.Thumbprint)" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          if ($null -eq $certificate -or -not $certificate.HasPrivateKey) {
            if ($null -ne $certificate -and
                $certificate.Thumbprint -match '^[0-9A-Fa-f]{40}$') {
              $certificatePath = "Cert:\CurrentUser\My\$($certificate.Thumbprint)"
              Remove-Item -LiteralPath $certificatePath -DeleteKey -Force
              if (Test-Path -LiteralPath $certificatePath) {
                throw 'Invalid package signing certificate or private key remained after cleanup.'
              }
            }
            throw 'Imported Windows certificate has no private key.'
          }
          if ($certificate.Subject -cne $env:EXPECTED_PUBLISHER) {
            $certificatePath = "Cert:\CurrentUser\My\$($certificate.Thumbprint)"
            Remove-Item -LiteralPath $certificatePath -DeleteKey -Force
            if (Test-Path -LiteralPath $certificatePath) {
              throw 'Wrong-subject package signing certificate or private key remained after cleanup.'
            }
            throw 'Imported Windows certificate subject differs from the reviewed publisher.'
          }
          "publisher=$($certificate.Subject)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sign only the reviewed package and portable candidates
        shell: pwsh
        env:
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TIMESTAMP_URL -notmatch '^https://') {
            throw 'WINDOWS_TIMESTAMP_URL must be a protected HTTPS RFC3161 endpoint.'
          }
          $ledger = @(Get-Content $env:SIGNING_INPUT_MANIFEST -Raw | ConvertFrom-Json)
          foreach ($entry in $ledger) {
            $actual = (Get-FileHash $entry.path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $entry.sha256) {
              throw "Signing input changed after review: $($entry.name)"
            }
            .\packaging\windows\sign.ps1 `
              -PackagePath $entry.path `
              -CertificateThumbprint '${{ steps.package-signing.outputs.thumbprint }}' `
              -TimestampUrl $env:TIMESTAMP_URL
          }

      - name: Remove package signing identity before bundle assembly
        if: always()
        shell: pwsh
        run: |
          $thumbprint = '${{ steps.package-signing.outputs.thumbprint }}'
          if ($thumbprint -match '^[0-9A-Fa-f]{40}$') {
            $certificatePath = "Cert:\CurrentUser\My\$thumbprint"
            Remove-Item -LiteralPath $certificatePath -DeleteKey -Force
            if (Test-Path -LiteralPath $certificatePath) {
              throw 'Package signing certificate or private key remained after cleanup.'
            }
          }

      - name: Assemble signed-inner bundle without signing identity
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $x64Root = 'packaging\windows\out\x64'
          $armRoot = 'packaging\windows\out\arm64'
          $signedX64 = @(Get-ChildItem $x64Root -Filter '*windows-x64-signed.msix')
          $signedArm = @(Get-ChildItem $armRoot -Filter '*windows-arm64-signed.msix')
          if ($signedX64.Count -ne 1 -or $signedArm.Count -ne 1) {
            throw 'Signed inner MSIX set is incomplete.'
          }
          .\packaging\windows\bundle.ps1 `
            -X64Msix $signedX64[0].FullName `
            -Arm64Msix $signedArm[0].FullName `
            -ReleaseMode `
            -Publisher $env:EXPECTED_PUBLISHER
          $bundle = @(Get-ChildItem packaging\windows\out\bundle -Filter '*release-candidate-unsigned.msixbundle')
          if ($bundle.Count -ne 1) {
            throw 'Reviewed unsigned bundle candidate set is incomplete.'
          }
          "BUNDLE_SIGNING_INPUT=$($bundle[0].FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUNDLE_SIGNING_SHA256=$((Get-FileHash $bundle[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Revalidate immutable tag and bundle bytes before bundle signing
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_COMMIT -ne $env:GITHUB_SHA) {
            throw 'release_commit changed before bundle signing.'
          }
          $tagObject = git rev-parse $env:GITHUB_REF
          $remoteTag = @(git ls-remote --exit-code origin $env:GITHUB_REF)
          if ($LASTEXITCODE -ne 0 -or $remoteTag.Count -ne 1 -or
              (($remoteTag[0] -split '\s+')[0]) -ne $tagObject) {
            throw 'Remote annotated release tag changed before bundle signing.'
          }
          if (-not (Test-Path -LiteralPath $env:BUNDLE_SIGNING_INPUT -PathType Leaf)) {
            throw 'Reviewed unsigned bundle candidate disappeared.'
          }
          $actual = (Get-FileHash $env:BUNDLE_SIGNING_INPUT -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:BUNDLE_SIGNING_SHA256) {
            throw 'Reviewed unsigned bundle candidate changed before identity import.'
          }

      - name: Import protected bundle signing identity
        id: bundle-signing
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Protected Windows bundle signing credentials are unavailable.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'gta-claw-bundle-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          try {
            $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate `
              -FilePath $pfx `
              -CertStoreLocation Cert:\CurrentUser\My `
****** `
              -Exportable:$false
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          if ($null -ne $certificate -and
              $certificate.Thumbprint -match '^[0-9A-Fa-f]{40}$') {
            "thumbprint=$($certificate.Thumbprint)" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          if ($null -eq $certificate -or -not $certificate.HasPrivateKey -or
              $certificate.Subject -cne $env:EXPECTED_PUBLISHER) {
            if ($null -ne $certificate -and
                $certificate.Thumbprint -match '^[0-9A-Fa-f]{40}$') {
              $certificatePath = "Cert:\CurrentUser\My\$($certificate.Thumbprint)"
              Remove-Item -LiteralPath $certificatePath -DeleteKey -Force
              if (Test-Path -LiteralPath $certificatePath) {
                throw 'Invalid bundle signing certificate or private key remained after cleanup.'
              }
            }
            throw 'Protected bundle signing identity is invalid.'
          }

      - name: Sign only the reviewed bundle candidate
        shell: pwsh
        env:
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:BUNDLE_SIGNING_INPUT -PathType Leaf)) {
            throw 'Reviewed unsigned bundle candidate disappeared.'
          }
          $actual = (Get-FileHash $env:BUNDLE_SIGNING_INPUT -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:BUNDLE_SIGNING_SHA256) {
            throw 'Reviewed unsigned bundle candidate changed before signing.'
          }
          .\packaging\windows\sign.ps1 `
            -PackagePath $env:BUNDLE_SIGNING_INPUT `
            -CertificateThumbprint '${{ steps.bundle-signing.outputs.thumbprint }}' `
            -TimestampUrl $env:TIMESTAMP_URL

      - name: Remove bundle signing identity before supply-chain assembly
        if: always()
        shell: pwsh
        run: |
          $thumbprint = '${{ steps.bundle-signing.outputs.thumbprint }}'
          if ($thumbprint -match '^[0-9A-Fa-f]{40}$') {
            $certificatePath = "Cert:\CurrentUser\My\$thumbprint"
            Remove-Item -LiteralPath $certificatePath -DeleteKey -Force
            if (Test-Path -LiteralPath $certificatePath) {
              throw 'Bundle signing certificate or private key remained after cleanup.'
            }
          }

      - name: Assemble and validate exact release publication bytes
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          EXPECTED_TAG_OBJECT: ${{ steps.policy.outputs.tag-object }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\packaging\windows\WindowsPackaging.psm1 -Force
          Import-Module .\packaging\windows\SupplyChain.psm1 -Force
          $publication = 'packaging\windows\out\release'
          New-Item -ItemType Directory -Force -Path $publication | Out-Null
          $primary = @(
            Get-ChildItem packaging\windows\out\x64 -File |
              Where-Object { $_.Name -match '-signed\.(zip|msix|msi)$' }
            Get-ChildItem packaging\windows\out\arm64 -File |
              Where-Object { $_.Name -match '-signed\.(zip|msix)$' }
            Get-ChildItem packaging\windows\out\bundle -File |
              Where-Object { $_.Name -match '-signed\.msixbundle$' }
          )
          if ($primary.Count -ne 8) {
            throw "Expected eight signed Windows release artifacts, found $($primary.Count)."
          }
          $portable = @($primary | Where-Object { $_.Name -match 'portable-signed\.zip$' })
          if ($portable.Count -ne 4) {
            throw "Expected four signed portable Windows archives, found $($portable.Count)."
          }
          foreach ($artifact in $primary) {
            $componentSet = $(if ($artifact.Extension -eq '.msi') {
              'combined'
            } elseif ($artifact.Name -match 'headless') {
              'headless'
            } else {
              'desktop'
            })
            $targets = @($(if ($artifact.Name -match 'arm64') {
              'aarch64-pc-windows-msvc'
            } else {
              'x86_64-pc-windows-msvc'
            }))
            if ($artifact.Extension -eq '.msixbundle') {
              $targets = @('x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc')
            }
            New-ArtifactSupplyChain `
              -RepoRoot $PWD `
              -ArtifactPath $artifact.FullName `
              -ComponentSet $componentSet `
              -RustTarget $targets `
              -ProvenanceTargets $targets | Out-Null
            & $env:SPDX_VALIDATOR -i "$($artifact.FullName).spdx.json"
            if ($LASTEXITCODE -ne 0) {
              throw "Official SPDX validator rejected '$($artifact.Name).spdx.json'."
            }
            Copy-Item -LiteralPath $artifact.FullName -Destination $publication
            Copy-Item -LiteralPath "$($artifact.FullName).sha256" -Destination $publication
            Copy-Item -LiteralPath "$($artifact.FullName).spdx.json" -Destination $publication
            Copy-Item -LiteralPath "$($artifact.FullName).provenance.json" -Destination $publication
          }
          [ordered]@{
            schema = 1
            platform = 'windows'
            version = $env:GITHUB_REF_NAME.Substring(1)
            releaseCommit = $env:GITHUB_SHA
            annotatedTagObject = $env:EXPECTED_TAG_OBJECT
          } |
            ConvertTo-Json -Compress |
            ForEach-Object { [IO.File]::WriteAllText(
              (Join-Path $publication 'release-identity-windows.json'),
              "$_`n",
              [Text.UTF8Encoding]::new($false)
            ) }
          Write-ArtifactSetChecksums `
            -Directory $publication `
            -ManifestName SHA256SUMS-windows | Out-Null
          .\packaging\windows\validate-artifacts.ps1 `
            -ArtifactDirectory $publication `
            -Publisher $env:EXPECTED_PUBLISHER `
            -ChecksumName SHA256SUMS-windows

      - name: Upload signed Windows release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gta-claw-windows-release-${{ github.sha }}
          path: packaging/windows/out/release
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish exact bytes to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || {
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "GTA Claw $tag" \
              --notes 'Native Rust release artifacts. Verify platform SHA256SUMS, SBOMs, and provenance before installation.' ||
              gh release view "$tag" >/dev/null
          }
          if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]]; then
            echo "Refusing to replace assets on an already-published release." >&2
            exit 1
          fi
          publication="packaging/windows/out/release"
          manifest="$publication/SHA256SUMS-windows"
          completion_state() {
            local metadata="$1"
            local asset_digest
            local asset_size
            local asset_state
            local count
            local download
            local expected_names
            local manifest_digest
            local manifest_path
            local manifest_size
            local name
            local referenced
            local referenced_file
            local remote_digest
            local remote_state
            local remote_size
            count="$(
              jq '[.assets[] | select(.name == "SHA256SUMS-windows")] | length' \
                <<<"$metadata"
            )" || return 3
            [[ "$count" == "0" ]] && return 1
            [[ "$count" == "1" ]] || return 2
            remote_state="$(
              jq -r '.assets[] | select(.name == "SHA256SUMS-windows") | .state' \
                <<<"$metadata"
            )" || return 3
            remote_size="$(
              jq -r '.assets[] | select(.name == "SHA256SUMS-windows") | .size' \
                <<<"$metadata"
            )" || return 3
            remote_digest="$(
              jq -r '.assets[] | select(.name == "SHA256SUMS-windows") | .digest' \
                <<<"$metadata"
            )" || return 3
            [[ "$remote_state" == "uploaded" ]] || return 2
            [[ "$remote_size" =~ ^[1-9][0-9]*$ ]] || return 2
            [[ "$remote_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 2
            download="$(
              mktemp -d "$RUNNER_TEMP/gta-claw-windows-completion.XXXXXX"
            )" || return 3
            gh release download "$tag" \
              --pattern SHA256SUMS-windows \
              --dir "$download" || return 3
            manifest_path="$download/SHA256SUMS-windows"
            [[ -f "$manifest_path" && ! -L "$manifest_path" ]] || return 2
            manifest_size="$(wc -c <"$manifest_path" | tr -d ' ')" || return 3
            [[ "$manifest_size" == "$remote_size" ]] || return 2
            manifest_digest="$(
              sha256sum "$manifest_path" | awk '{print "sha256:" $1}'
            )" || return 3
            [[ "$manifest_digest" == "$remote_digest" ]] || return 2

            expected_names="$(
              awk '$0 ~ /^[0-9a-f]{64}  [^/\\]+$/ {
                     print substr($0, 67)
                   }' "$manifest" |
                LC_ALL=C sort
            )" || return 3
            referenced_file="$download/referenced-names"
            : >"$referenced_file" || return 3
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ "$line" =~ ^([0-9a-f]{64})\ \ ([^/\\]+)$ ]] || return 2
              remote_digest="sha256:${BASH_REMATCH[1]}"
              name="${BASH_REMATCH[2]}"
              printf '%s\n' "$name" >>"$referenced_file" || return 3
              count="$(
                jq --arg name "$name" \
                  '[.assets[] | select(.name == $name)] | length' <<<"$metadata"
              )" || return 3
              [[ "$count" == "1" ]] || return 2
              asset_state="$(
                jq -r --arg name "$name" \
                  '.assets[] | select(.name == $name) | .state' <<<"$metadata"
              )" || return 3
              asset_size="$(
                jq -r --arg name "$name" \
                  '.assets[] | select(.name == $name) | .size' <<<"$metadata"
              )" || return 3
              asset_digest="$(
                jq -r --arg name "$name" \
                  '.assets[] | select(.name == $name) | .digest' <<<"$metadata"
              )" || return 3
              [[ "$asset_state" == "uploaded" ]] || return 2
              [[ "$asset_size" =~ ^[1-9][0-9]*$ ]] || return 2
              [[ "$asset_digest" == "$remote_digest" ]] || return 2
            done <"$manifest_path"
            referenced="$(LC_ALL=C sort "$referenced_file")" || return 3
            [[ -n "$referenced" && "$referenced" == "$expected_names" ]] || return 2
            return 0
          }
          release_assets="$(gh release view "$tag" --json assets)"
          if completion_state "$release_assets"; then
            echo "Windows release completion is valid and immutable; retaining published bytes."
            exit 0
          else
            completion_status=$?
            if [[ "$completion_status" -eq 2 ]]; then
              gh release delete-asset "$tag" SHA256SUMS-windows --yes
            elif [[ "$completion_status" -eq 3 ]]; then
              echo "Unable to verify existing Windows completion; refusing mutation." >&2
              exit 1
            fi
          fi
          paths=()
          while IFS= read -r -d '' path; do
            if [[ "$(basename "$path")" != "SHA256SUMS-windows" ]]; then
              paths+=("$path")
            fi
          done < <(find "$publication" -mindepth 1 -maxdepth 1 -type f -print0)
          [[ "${#paths[@]}" -gt 0 ]] || {
            echo "No Windows release artifacts are available to upload." >&2
            exit 1
          }
          release_assets="$(gh release view "$tag" --json assets)"
          if completion_state "$release_assets"; then
            echo "Windows release completion became valid and immutable; retaining published bytes."
            exit 0
          else
            completion_status=$?
            if [[ "$completion_status" -eq 2 ]]; then
              gh release delete-asset "$tag" SHA256SUMS-windows --yes
            elif [[ "$completion_status" -eq 3 ]]; then
              echo "Unable to verify raced Windows completion; refusing mutation." >&2
              exit 1
            fi
          fi
          existing="$(jq -r '.assets[].name' <<<"$release_assets")"
          for path in "${paths[@]}"; do
            name="$(basename "$path")"
            if grep -Fqx "$name" <<<"$existing"; then
              gh release delete-asset "$tag" "$name" --yes
            fi
          done
          gh release upload "$tag" "${paths[@]}"
          gh release upload "$tag" "$manifest"

      - name: Always remove signing identity
        if: always()
        shell: pwsh
        run: |
          foreach ($thumbprint in @(
            '${{ steps.package-signing.outputs.thumbprint }}',
            '${{ steps.bundle-signing.outputs.thumbprint }}'
          )) {
            if ($thumbprint -match '^[0-9A-Fa-f]{40}$') {
              $certificatePath = "Cert:\CurrentUser\My\$thumbprint"
              if (Test-Path -LiteralPath $certificatePath) {
                Remove-Item -LiteralPath $certificatePath -DeleteKey -Force
              }
              if (Test-Path -LiteralPath $certificatePath) {
                throw 'Windows signing certificate or private key remained after final cleanup.'
              }
            }
          }
          foreach ($pfxName in @('gta-claw-signing.pfx', 'gta-claw-bundle-signing.pfx')) {
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $pfxName) `
              -Force -ErrorAction SilentlyContinue
          }

  finalize-release:
    name: Finalize joint desktop release
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/joint-release-finalize.yml
    with:
      tag: ${{ github.ref_name }}
      release_commit: ${{ needs.release.outputs.release-sha }}
      tag_object: ${{ needs.release.outputs.tag-object }}
