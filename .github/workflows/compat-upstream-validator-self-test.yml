name: Compat upstream validator self-test

on:
  pull_request:
    paths:
      - ".github/workflows/compat-upstream-validator-self-test.yml"
      - "compat/upstream/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-upstream-validator-self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validator-self-test:
    name: Positive baseline and negative tamper cases
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run validator self-test
        shell: powershell
        run: ./compat/upstream/validate-self-test.ps1
