name: pinned upstream Gateway reference

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-gateway-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-rust-reference:
    name: Frozen OpenClaw b43e832 Rust contract
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GTA Claw
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Reject JavaScript toolchain artifacts
        run: cargo test --locked --package claw-repo-policy --test repository_policy

      - name: Verify frozen compatibility snapshot
        shell: powershell
        run: ./compat/upstream/validate.ps1

      - name: Test protocol and Gateway client against frozen contracts
        run: >-
          cargo test --locked
          --package claw-protocol
          --package claw-gateway-client
