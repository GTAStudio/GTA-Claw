name: rust

on:
  push:
    branches:
      - main
    paths:
      - ".cargo/**"
      - ".gitattributes"
      - ".github/workflows/rust.yml"
      - "apps/**"
      - "crates/**"
      - "desktop/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  pull_request:
    paths:
      - ".cargo/**"
      - ".gitattributes"
      - ".github/workflows/rust.yml"
      - "apps/**"
      - "crates/**"
      - "desktop/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Headless (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CARGO_BUILD_WARNINGS: deny
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Assert root metadata excludes Slint
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 |
            python -c 'import json, sys; names = {package["name"] for package in json.load(sys.stdin)["packages"]}; forbidden = sorted(name for name in names if name == "slint" or name == "slint-build" or name.startswith("i-slint")); assert not forbidden, f"root metadata contains Slint packages: {forbidden}"'

  msrv:
    name: MSRV (1.94.0)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Check workspace at MSRV
        run: cargo +1.94.0 check --workspace --all-targets --locked

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    env:
      CARGO_BUILD_WARNINGS: deny
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check

      - name: Check workspace
        run: cargo check --manifest-path desktop/Cargo.toml --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path desktop/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path desktop/Cargo.toml --workspace --all-targets --locked

      - name: Build desktop application
        run: cargo build --manifest-path desktop/Cargo.toml --workspace --locked

  desktop-unsupported:
    name: Desktop rejects Linux
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_WARNINGS: deny
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Assert Linux desktop graph excludes Slint
        shell: bash
        run: |
          cargo metadata --manifest-path desktop/Cargo.toml --locked --format-version 1 \
            --filter-platform x86_64-unknown-linux-gnu |
            python -c 'import json, sys; names = {package["name"] for package in json.load(sys.stdin)["packages"]}; forbidden = sorted(name for name in names if name == "slint" or name == "slint-build" or name.startswith("i-slint")); assert not forbidden, f"Linux desktop metadata contains Slint packages: {forbidden}"'

      - name: Assert desktop build rejects Linux
        shell: bash
        run: |
          set +e
          output=$(cargo check --manifest-path desktop/Cargo.toml \
            --package gta-claw-desktop --locked 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Desktop build unexpectedly succeeded on Linux"
            exit 1
          fi
          grep -F "gta-claw-desktop supports only Windows and macOS" <<<"$output"

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87
        with:
          arguments: --all-features
          command: check
          manifest-path: ./Cargo.toml

      - name: Audit root lockfile
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit desktop lockfile
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: desktop

      - name: Test patched wayland-scanner parser
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/wayland-scanner-target
        run: cargo test --manifest-path desktop/vendor/wayland-scanner-0.31.10/Cargo.toml --locked --lib parse::tests

      - name: Check Windows desktop dependency policy
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87
        with:
          arguments: --target x86_64-pc-windows-msvc
          command: check
          command-arguments: --config desktop/deny.toml --warn unmaintained advisories licenses sources
          manifest-path: ./desktop/Cargo.toml

      - name: Check macOS desktop dependency policy
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87
        with:
          arguments: --target aarch64-apple-darwin
          command: check
          command-arguments: --config desktop/deny.toml --warn unmaintained advisories licenses sources
          manifest-path: ./desktop/Cargo.toml
