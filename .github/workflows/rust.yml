name: rust

on:
  push:
    branches:
      - main
    paths:
      - ".cargo/**"
      - ".gitattributes"
      - ".github/fixtures/cargo-audit/**"
      - ".github/workflows/macos-packaging.yml"
      - ".github/workflows/rust.yml"
      - "apps/**"
      - "crates/**"
      - "desktop/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  pull_request:
    paths:
      - ".cargo/**"
      - ".gitattributes"
      - ".github/fixtures/cargo-audit/**"
      - ".github/workflows/macos-packaging.yml"
      - ".github/workflows/rust.yml"
      - "apps/**"
      - "crates/**"
      - "desktop/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Headless (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CARGO_BUILD_WARNINGS: deny
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Assert root metadata excludes Slint
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 |
            python -c 'import json, sys; names = {package["name"] for package in json.load(sys.stdin)["packages"]}; forbidden = sorted(name for name in names if name == "slint" or name == "slint-build" or name.startswith("i-slint")); assert not forbidden, f"root metadata contains Slint packages: {forbidden}"'

  msrv:
    name: MSRV (1.94.0)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Check workspace at MSRV
        run: cargo +1.94.0 check --workspace --all-targets --locked

  gateway-stress:
    name: Gateway synchronization stress (macOS Intel)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Repeat deterministic Gateway regressions
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 100); do
            echo "Gateway synchronization iteration ${iteration}/100"
            cargo test --locked --package claw-gateway-client \
              --test gateway_client \
              cumulative_outbound_bytes_bound_multiple_requests_behind_stalled_writer \
              -- --exact
            cargo test --locked --package claw-gateway-client \
              --test gateway_client \
              expired_queued_side_effect_is_never_transmitted_and_releases_budgets \
              -- --exact
          done

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    env:
      CARGO_BUILD_WARNINGS: deny
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check

      - name: Check workspace
        run: cargo check --manifest-path desktop/Cargo.toml --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path desktop/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path desktop/Cargo.toml --workspace --all-targets --locked

      - name: Build desktop application
        run: cargo build --manifest-path desktop/Cargo.toml --workspace --locked

  desktop-unsupported:
    name: Desktop rejects Linux
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_WARNINGS: deny
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Assert Linux desktop graph excludes Slint
        shell: bash
        run: |
          cargo metadata --manifest-path desktop/Cargo.toml --locked --format-version 1 \
            --filter-platform x86_64-unknown-linux-gnu |
            python -c 'import json, sys; names = {package["name"] for package in json.load(sys.stdin)["packages"]}; forbidden = sorted(name for name in names if name == "slint" or name == "slint-build" or name.startswith("i-slint")); assert not forbidden, f"Linux desktop metadata contains Slint packages: {forbidden}"'

      - name: Assert desktop build rejects Linux
        shell: bash
        run: |
          set +e
          output=$(cargo check --manifest-path desktop/Cargo.toml \
            --package gta-claw-desktop --locked 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Desktop build unexpectedly succeeded on Linux"
            exit 1
          fi
          grep -F "gta-claw-desktop supports only Windows and macOS" <<<"$output"

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate supply-chain policy
        run: cargo test --locked --package claw-security --test desktop_supply_chain_policy

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87
        with:
          arguments: --all-features
          command: check
          manifest-path: ./Cargo.toml

      - name: Install pinned cargo-audit
        shell: bash
        env:
          CARGO_AUDIT_CRATE_SHA256: 700c2b240f7fd330c24b675fe429f73a5b676531fcc6300400b2b67f155ba12a
          CARGO_AUDIT_VERSION: 0.22.2
        run: |
          set -euo pipefail
          cargo info "cargo-audit@${CARGO_AUDIT_VERSION}" --quiet
          mapfile -t archives < <(
            find "${CARGO_HOME:-$HOME/.cargo}/registry/cache" \
              -type f -name "cargo-audit-${CARGO_AUDIT_VERSION}.crate"
          )
          test "${#archives[@]}" -gt 0
          for archive in "${archives[@]}"; do
            printf '%s  %s\n' "$CARGO_AUDIT_CRATE_SHA256" "$archive" |
              sha256sum --check -
          done
          cargo install cargo-audit --version "=${CARGO_AUDIT_VERSION}" --locked --force
          test "$(cargo audit --version)" = "cargo-audit-audit ${CARGO_AUDIT_VERSION}"

      - name: Audit root lockfile
        run: cargo audit --file Cargo.lock

      - name: Audit desktop lockfile
        run: cargo audit --file desktop/Cargo.lock --no-fetch

      - name: Test cargo-audit exit policy
        shell: bash
        run: |
          set -euo pipefail
          for event_name in pull_request push; do
            export GITHUB_EVENT_NAME="$event_name"
            if [[ "$event_name" == "pull_request" ]]; then
              export GITHUB_HEAD_REF="audit-policy-fixture"
            else
              unset GITHUB_HEAD_REF
            fi

            warning_output="$(
              cargo audit --no-fetch \
                --file .github/fixtures/cargo-audit/unmaintained/Cargo.lock 2>&1
            )"
            printf '%s\n' "$warning_output"
            grep -F "RUSTSEC-2025-0141" <<<"$warning_output"

            set +e
            vulnerable_output="$(
              cargo audit --no-fetch \
                --file .github/fixtures/cargo-audit/vulnerable/Cargo.lock 2>&1
            )"
            vulnerable_status=$?
            set -e
            printf '%s\n' "$vulnerable_output"
            test "$vulnerable_status" -ne 0
            grep -F "RUSTSEC-2026-0194" <<<"$vulnerable_output"
            grep -F "RUSTSEC-2026-0195" <<<"$vulnerable_output"
          done

      - name: Check Windows x64 desktop dependency policy
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87
        with:
          arguments: --target x86_64-pc-windows-msvc
          command: check
          command-arguments: --config desktop/deny.toml --warn unmaintained advisories licenses sources
          manifest-path: ./desktop/Cargo.toml

      - name: Check Windows ARM64 desktop dependency policy
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87
        with:
          arguments: --target aarch64-pc-windows-msvc
          command: check
          command-arguments: --config desktop/deny.toml --warn unmaintained advisories licenses sources
          manifest-path: ./desktop/Cargo.toml

      - name: Check macOS Intel desktop dependency policy
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87
        with:
          arguments: --target x86_64-apple-darwin
          command: check
          command-arguments: --config desktop/deny.toml --warn unmaintained advisories licenses sources
          manifest-path: ./desktop/Cargo.toml

      - name: Check macOS ARM64 desktop dependency policy
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87
        with:
          arguments: --target aarch64-apple-darwin
          command: check
          command-arguments: --config desktop/deny.toml --warn unmaintained advisories licenses sources
          manifest-path: ./desktop/Cargo.toml
