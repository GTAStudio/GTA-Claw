name: Android packaging

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-packaging.yml"
      - "android/**"
      - "apps/gta-claw-android/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - ".github/workflows/android-packaging.yml"
      - "android/**"
      - "apps/gta-claw-android/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  policy:
    name: Android source and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install checksum-pinned cargo-deny
        shell: bash
        run: |
          set -euo pipefail
          readonly version="0.20.2"
          readonly digest="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          readonly archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          readonly destination="$RUNNER_TEMP/cargo-deny"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check -
          mkdir -p "$destination"
          tar --extract --gzip --file "$archive" --directory "$destination" --strip-components=1
          "$destination/cargo-deny" --version
          printf '%s\n' "$destination" >> "$GITHUB_PATH"

      - name: Run Android shell source tests
        shell: bash
        run: |
          set -euo pipefail
          ./android/scripts/workflow-self-test.sh
          ./android/scripts/check.sh

      - name: Check Android workspace at MSRV
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 check --manifest-path android/Cargo.toml --workspace --all-targets --locked

      - name: Check Android dependency policy
        run: cargo deny --manifest-path android/Cargo.toml --config android/deny.toml check

  package:
    name: Android arm64 APK and target checks
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install pinned Android SDK and NDK inputs
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.14904198"
          printf 'ANDROID_NDK_HOME=%s\n' "$ANDROID_HOME/ndk/30.0.14904198" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_ROOT=%s\n' "$ANDROID_HOME/ndk/30.0.14904198" >> "$GITHUB_ENV"

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install pinned cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked

      - name: Verify both reviewed Android Skia archives
        shell: bash
        env:
          SKIA_CACHE_DIR: ${{ runner.temp }}/gta-claw-skia
        run: |
          set -euo pipefail
          ./android/scripts/fetch-skia.sh aarch64-linux-android "$SKIA_CACHE_DIR"
          ./android/scripts/fetch-skia.sh x86_64-linux-android "$SKIA_CACHE_DIR"

      - name: Check all declared Android targets
        shell: bash
        env:
          SKIA_CACHE_DIR: ${{ runner.temp }}/gta-claw-skia
        run: ./android/scripts/check-targets.sh

      - name: Build arm64 debug-signed prototype APK
        shell: bash
        env:
          SKIA_CACHE_DIR: ${{ runner.temp }}/gta-claw-skia
        run: ./android/scripts/package.sh aarch64-linux-android

      - name: Validate APK contents
        shell: bash
        run: |
          set -euo pipefail
          apk="android/target/debug/apk/gta-claw-android.apk"
          test -f "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libgta_claw_android_shell.so'
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk")"
          grep -F "minSdkVersion:'26'" <<<"$badging"
          grep -F "targetSdkVersion:'36'" <<<"$badging"
          grep -F "uses-permission: name='android.permission.INTERNET'" <<<"$badging"
          grep -F "native-code: 'arm64-v8a'" <<<"$badging"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"

      - name: Upload prototype APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gta-claw-android-arm64-${{ github.sha }}
          path: android/target/debug/apk/gta-claw-android.apk
          if-no-files-found: error
          retention-days: 14
