name: macOS packaging prototype

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-packaging.yml"
      - ".github/workflows/joint-release-finalize.yml"
      - "packaging/macos/**"
      - "apps/**"
      - "crates/**"
      - "desktop/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - ".github/workflows/macos-packaging.yml"
      - ".github/workflows/joint-release-finalize.yml"
      - "packaging/macos/**"
      - "apps/**"
      - "crates/**"
      - "desktop/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:
    inputs:
      release:
        description: Exercise the protected signing and notarization contract
        required: true
        type: boolean
        default: false
      version:
        description: Numeric X.Y.Z release version (defaults to Cargo workspace version)
        required: false
        type: string
      release_commit:
        description: Full immutable commit SHA selected by the release tag
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  RUSTFLAGS: -Dwarnings

jobs:
  source-policy:
    name: Source policy and Linux rejection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check shell syntax and forbidden committed artifacts
        shell: bash
        run: |
          set -euo pipefail
          find packaging/macos -type f -name '*.sh' -print0 |
            while IFS= read -r -d '' script; do bash -n "$script"; done
          if git ls-files packaging/macos |
            grep -Ei '\.(app|dmg|pkg|p12|cer|key|icns|png|tar\.gz|zip)$'; then
            echo "Generated package, credential, image, or binary committed under packaging/macos"
            exit 1
          fi
          if grep -RInE '(^|[[:space:]])(npm|npx|node|bun|pnpm)([[:space:]]|$)' \
            packaging/macos --include='*.sh' --include='*.yml'; then
            echo "JavaScript package/runtime command found in macOS packaging automation"
            exit 1
          fi
          ./packaging/macos/workflow-self-test.sh

      - name: Preserve Linux desktop rejection
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path desktop/Cargo.toml --locked --format-version 1 \
            --filter-platform x86_64-unknown-linux-gnu |
            python3 -c 'import json, sys; names = {package["name"] for package in json.load(sys.stdin)["packages"]}; forbidden = sorted(name for name in names if name == "slint" or name == "slint-build" or name.startswith("i-slint")); assert not forbidden, f"Linux desktop metadata contains Slint packages: {forbidden}"'
          set +e
          output=$(cargo check --manifest-path desktop/Cargo.toml \
            --package gta-claw-desktop --locked 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -F "requires a Windows or macOS build host" <<<"$output"

  native:
    name: Native ${{ matrix.arch }} on ${{ matrix.runner }}
    needs: source-policy
    strategy:
      fail-fast: false
      matrix:
        # x86_64 is no longer a shipped target, but this row is the only job in the
        # repository that runs `cargo test --workspace --all-targets` on an Intel macOS
        # host: rust.yml runs the full workspace only on macos-latest (arm64), ubuntu and
        # windows, and its macos-15-intel job runs two named claw-gateway-client tests.
        # Do not prune this row when pruning shipped targets; it is test coverage, not
        # packaging.
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Record Apple tool versions
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          rustc -Vv
          cargo -V
          uname -m

      - name: Format both Cargo workspaces
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path desktop/Cargo.toml --all -- --check

      - name: Check both Cargo workspaces
        run: |
          cargo check --workspace --all-targets --locked
          cargo check --manifest-path desktop/Cargo.toml --workspace --all-targets --locked

      - name: Clippy both Cargo workspaces
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path desktop/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Test both Cargo workspaces natively
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          cargo test --workspace --all-targets --locked
          cargo test --manifest-path desktop/Cargo.toml --workspace --all-targets --locked

      - name: Smoke-test native desktop window backend
        timeout-minutes: 2
        env:
          SLINT_BACKEND: winit-software
        run: cargo test --manifest-path desktop/Cargo.toml --test macos_winit_smoke --locked

      - name: Build and validate native packages
        shell: bash
        run: ./packaging/macos/build.sh native

      - name: Run packaging self-tests
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          OUTPUT_ROOT="$GITHUB_WORKSPACE/target/macos-self-test" \
            ./packaging/macos/self-test.sh

      - name: Scan native artifacts for JavaScript runtimes
        shell: bash
        run: |
          set -euo pipefail
          if find target/macos-package -type f \( \
            -iname 'node' -o -iname 'npm' -o -iname 'bun' -o -iname 'pnpm' -o \
            -iname '*.js' -o -iname '*.mjs' -o -iname '*.cjs' -o -iname '*.node' \
          \) -print -quit | grep .; then
            exit 1
          fi

      - name: Upload ephemeral native prototype artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ matrix.arch }}-prototype-${{ github.sha }}
          path: |
            target/macos-package/apps/${{ matrix.arch }}/GTA Claw.app
            target/macos-package/headless/${{ matrix.arch }}/*.tar.gz
            target/macos-package/headless/${{ matrix.arch }}/*.sha256
            target/macos-package/manifests/*.sha256
          if-no-files-found: error
          retention-days: 7

  containers:
    name: Container assembly and release input
    needs: source-policy
    runs-on: macos-15
    outputs:
      release-payload-sha256: ${{ steps.release-input.outputs.sha256 }}
      release-artifact-id: ${{ steps.release-upload.outputs.artifact-id }}
      release-artifact-digest: ${{ steps.release-upload.outputs.artifact-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Build and validate the native arm64 app
        shell: bash
        run: ./packaging/macos/build.sh native

      - name: Build unsigned prototype DMG and PKG
        shell: bash
        run: |
          ./packaging/macos/package.sh prototype \
            "$GITHUB_WORKSPACE/target/macos-package/apps/arm64/GTA Claw.app"
          hdiutil verify target/macos-package/distribution/*.dmg
          pkgutil --payload-files target/macos-package/distribution/*.pkg |
            LC_ALL=C sort > target/macos-package/distribution/pkg-payload.txt

      - name: Validate architecture and content hashes
        shell: bash
        run: |
          set -euo pipefail
          app="target/macos-package/apps/arm64/GTA Claw.app"
          ./packaging/macos/validate.sh "$app" "arm64" adhoc
          lipo "$app/Contents/MacOS/gta-claw-desktop" -verify_arch arm64
          (
            cd target/macos-package/distribution
            shasum -a 256 -c SHA256SUMS
          )

      - name: Prepare immutable release input
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        id: release-input
        shell: bash
        run: |
          set -euo pipefail
          payload_sha256="$(
            ./packaging/macos/prepare-release-input.sh \
              "$GITHUB_WORKSPACE/target/macos-package/apps/arm64/GTA Claw.app" \
              "$GITHUB_SHA" \
              "$GITHUB_REF"
          )"
          test "${#payload_sha256}" -eq 64
          echo "sha256=$payload_sha256" >>"$GITHUB_OUTPUT"

      - name: Upload immutable release input
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        id: release-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-release-input-${{ github.sha }}
          path: target/macos-package/release-input/gta-claw-*-release-input.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload ephemeral container prototype artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-containers-prototype-${{ github.sha }}
          path: |
            target/macos-package/apps/arm64/GTA Claw.app
            target/macos-package/headless/**/*.tar.gz
            target/macos-package/headless/**/*.sha256
            target/macos-package/distribution/*
            target/macos-package/manifests/*.sha256
          if-no-files-found: error
          retention-days: 7

  release-disabled:
    name: Release signing explicitly disabled
    if: github.event_name != 'workflow_dispatch' || inputs.release != true
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release mode was not requested; no signing, notarization, publication, or release upload occurred."

  release-policy:
    name: Validate immutable release ref
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    needs: source-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-sha: ${{ steps.policy.outputs.release-sha }}
      release-ref: ${{ steps.policy.outputs.release-ref }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - name: Checkout candidate commit without secrets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned release metadata toolchain
        shell: /usr/bin/env -i PATH=/usr/bin:/bin /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          readonly rustup_bin="/home/runner/.cargo/bin/rustup"
          [[ -x "$rustup_bin" ]]
          "$rustup_bin" toolchain install 1.97.1 \
            --profile minimal \
            --no-self-update

      - name: Enforce protected main and semantic tag policy
        id: policy
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$DEFAULT_BRANCH" = "main" || {
            echo "Release policy requires main as the protected default branch" >&2
            exit 1
          }
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release mode requires a semantic vX.Y.Z tag, not $GITHUB_REF" >&2
            exit 1
          }
          test "${GITHUB_REF_TYPE:-}" = "tag" || {
            echo "Release mode rejects non-tag workflow_dispatch refs" >&2
            exit 1
          }
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release_commit must be a full lowercase commit SHA" >&2
            exit 1
          }

          tag_commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          tag_object="$(git rev-parse "$GITHUB_REF")"
          test "$(git cat-file -t "$GITHUB_REF")" = "tag" || {
            echo "Release mode requires an annotated, protected tag" >&2
            exit 1
          }
          test "$tag_commit" = "$GITHUB_SHA" || {
            echo "Tag commit does not match the workflow commit" >&2
            exit 1
          }
          test "$RELEASE_COMMIT" = "$GITHUB_SHA" || {
            echo "release_commit does not match the immutable workflow commit" >&2
            exit 1
          }

          remote_tag_object="$(
            git ls-remote --exit-code origin "$GITHUB_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_tag_object" = "$tag_object" || {
            echo "Remote tag changed after workflow dispatch" >&2
            exit 1
          }
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "Release commit is not reachable from protected main" >&2
            exit 1
          }

          version="${GITHUB_REF_NAME#v}"
          readonly metadata_script="$GITHUB_WORKSPACE/.github/trusted/desktop-supply-chain-policy/scripts/release-metadata-version.sh"
          readonly metadata_root="${RUNNER_TEMP}/gta-claw-release-version"
          readonly rustup_bin="/home/runner/.cargo/bin/rustup"
          [[ "$RUNNER_TEMP" == /home/runner/work/_temp/* ]]
          [[ "$GITHUB_WORKSPACE" == /home/runner/work/* ]]
          [[ -f "$metadata_script" && ! -L "$metadata_script" ]]
          [[ -x "$rustup_bin" && ! -e "$metadata_root" ]]
          cargo_bin="$(
            /usr/bin/env -i \
              HOME=/home/runner \
              RUSTUP_HOME=/home/runner/.rustup \
              PATH=/usr/bin:/bin \
              "$rustup_bin" which --toolchain 1.97.1 cargo
          )"
          rustc_bin="$(
            /usr/bin/env -i \
              HOME=/home/runner \
              RUSTUP_HOME=/home/runner/.rustup \
              PATH=/usr/bin:/bin \
              "$rustup_bin" which --toolchain 1.97.1 rustc
          )"
          [[ "$cargo_bin" == /home/runner/.rustup/toolchains/1.97.1-*/bin/cargo ]]
          [[ "$rustc_bin" == /home/runner/.rustup/toolchains/1.97.1-*/bin/rustc ]]
          [[ -x "$cargo_bin" && -x "$rustc_bin" ]]
          cargo_version="$(
            /bin/bash "$metadata_script" \
              "$cargo_bin" \
              "$rustc_bin" \
              "$GITHUB_WORKSPACE" \
              "$metadata_root" \
              "$version" \
              "$REQUESTED_VERSION"
          )"
          test "$version" = "$cargo_version" || {
            echo "Tag version $version does not match Cargo version $cargo_version" >&2
            exit 1
          }
          if [[ -n "$REQUESTED_VERSION" ]]; then
            test "$REQUESTED_VERSION" = "$version" || {
              echo "Requested version does not match the release tag" >&2
              exit 1
            }
          fi
          {
            printf 'release-sha=%s\n' "$GITHUB_SHA"
            printf 'release-ref=%s\n' "$GITHUB_REF"
            printf 'version=%s\n' "$version"
          } >>"$GITHUB_OUTPUT"

  protected-release-contract:
    name: Protected signing and notarization contract
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    needs:
      - native
      - containers
      - release-policy
    runs-on: macos-15
    environment: macos-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact trusted release verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.release-policy.outputs.release-sha }}
          path: trusted-release-policy
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          sparse-checkout: .github/trusted/desktop-supply-chain-policy/scripts/verify-macos-app.sh
          sparse-checkout-cone-mode: false
          submodules: false
          lfs: false
          clean: true
          set-safe-directory: false
          show-progress: false

      - name: Download exact secret-free release input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.containers.outputs.release-artifact-id }}
          path: ${{ runner.temp }}/gta-claw-release-download

      - name: Verify artifact digest, metadata, and unsigned app
        shell: bash
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.containers.outputs.release-artifact-id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.containers.outputs.release-artifact-digest }}
          EXPECTED_PAYLOAD_SHA256: ${{ needs.containers.outputs.release-payload-sha256 }}
          EXPECTED_RELEASE_REF: ${{ needs.release-policy.outputs.release-ref }}
          EXPECTED_RELEASE_SHA: ${{ needs.release-policy.outputs.release-sha }}
          EXPECTED_VERSION: ${{ needs.release-policy.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          artifact_metadata="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID")"
          test "$(jq -r '.name' <<<"$artifact_metadata")" = \
            "macos-release-input-$EXPECTED_RELEASE_SHA"
          test "$(jq -r '.expired' <<<"$artifact_metadata")" = "false"
          test "$(jq -r '.workflow_run.id' <<<"$artifact_metadata")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.digest' <<<"$artifact_metadata")" = \
            "sha256:$EXPECTED_ARTIFACT_DIGEST"
          payload="$RUNNER_TEMP/gta-claw-release-download/gta-claw-$EXPECTED_VERSION-release-input.tar.gz"
          test -f "$payload" -a ! -L "$payload"
          test "$(shasum -a 256 "$payload" | awk '{ print $1 }')" = "$EXPECTED_PAYLOAD_SHA256"

          listing="$RUNNER_TEMP/gta-claw-release-listing"
          tar -tzf "$payload" >"$listing"
          if grep -E '(^/|(^|/)\.\.(/|$)|\\)' "$listing"; then
            echo "Release input contains an unsafe archive path" >&2
            exit 1
          fi
          if tar -tvzf "$payload" | awk '$1 ~ /^[lh]/ { found = 1 } END { exit !found }'; then
            echo "Release input contains a link entry" >&2
            exit 1
          fi

          state="$RUNNER_TEMP/gta-claw-release"
          test ! -L "$state"
          rm -rf -- "$state"
          mkdir -m 0700 "$state"
          tar -xzf "$payload" -C "$state"
          root="$state/release-input"
          test -d "$root" -a ! -L "$root"
          test -z "$(find "$root" -type l -print -quit)"
          actual_top="$(
            find "$root" -mindepth 1 -maxdepth 1 -exec basename {} \; |
              LC_ALL=C sort
          )"
          expected_top="$(printf '%s\n' 'GTA Claw.app' SHA256SUMS release-metadata.plist | LC_ALL=C sort)"
          test "$actual_top" = "$expected_top"
          (cd "$root" && shasum -a 256 -c SHA256SUMS)

          metadata="$root/release-metadata.plist"
          plutil -lint "$metadata" >/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :SourceSHA' "$metadata")" = "$EXPECTED_RELEASE_SHA"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SourceRef' "$metadata")" = "$EXPECTED_RELEASE_REF"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Version' "$metadata")" = "$EXPECTED_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BundleIdentifier' "$metadata")" = "com.gtastudio.gta-claw"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumSystemVersion' "$metadata")" = "14.0"

          app="$root/GTA Claw.app"
          verifier="$GITHUB_WORKSPACE/trusted-release-policy/.github/trusted/desktop-supply-chain-policy/scripts/verify-macos-app.sh"
          plist="$app/Contents/Info.plist"
          binary="$app/Contents/MacOS/gta-claw-desktop"
          /bin/bash "$verifier" "$app"
          test -f "$binary" -a -x "$binary" -a ! -L "$binary"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.gtastudio.gta-claw"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$EXPECTED_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "14.0"
          lipo "$binary" -verify_arch arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvvv "$app" 2>&1 | grep -F 'Signature=adhoc' >/dev/null
          dependencies="$(otool -L "$binary")" || {
            echo "otool could not inspect release app dependencies" >&2
            exit 1
          }
          if tail -n +2 <<<"$dependencies" |
            sed -E 's/^[[:space:]]*//; /:$/d; s/[[:space:]]+\(compatibility version.*$//' |
            grep -Ev '^(/System/Library/Frameworks/|/usr/lib/)'; then
            echo "Release app contains a non-system dynamic dependency" >&2
            exit 1
          fi
          load_commands="$(otool -l "$binary")" || {
            echo "otool could not inspect release app load commands" >&2
            exit 1
          }
          if awk '$1 == "cmd" && $2 == "LC_RPATH" { in_rpath = 1; next }
                 in_rpath && $1 == "path" { print $2; in_rpath = 0 }' \
              <<<"$load_commands" |
            grep -Ev '^(@executable_path/\.\./Frameworks|@loader_path/\.\./Frameworks)$'; then
            echo "Release app contains an unexpected rpath" >&2
            exit 1
          fi
          if find "$app" -type f \( \
            -iname 'node' -o -iname 'npm' -o -iname 'bun' -o -iname 'pnpm' -o \
            -iname '*.js' -o -iname '*.mjs' -o -iname '*.cjs' -o -iname '*.node' \
          \) -print -quit | grep .; then
            echo "Release app contains a JavaScript runtime artifact" >&2
            exit 1
          fi

      - name: Import application identity and sign app
        shell: bash
        env:
          APP_CERTIFICATE_P12: ${{ secrets.MACOS_APP_CERTIFICATE_P12 }}
          APP_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          umask 077
          for variable in APP_CERTIFICATE_P12 APP_CERTIFICATE_PASSWORD DEVELOPER_ID_APPLICATION; do
            test -n "${!variable:-}" || {
              echo "Protected application-signing secret is missing: $variable" >&2
              exit 1
            }
          done
          [[ "$DEVELOPER_ID_APPLICATION" == "Developer ID Application:"* ]]

          state="$RUNNER_TEMP/gta-claw-release"
          keychain="$state/signing.keychain-db"
          password_file="$state/keychain-password"
          app_p12="$state/app.p12"
          trap 'rm -f -- "$app_p12"' EXIT INT TERM
          openssl rand -hex 32 >"$password_file"
          keychain_password="$(cat "$password_file")"
          printf '%s' "$APP_CERTIFICATE_P12" | base64 -D >"$app_p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s \
            "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security import "$app_p12" \
            -k "$keychain" -P "$APP_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security find-identity -p codesigning -v "$keychain" |
            grep -F "\"$DEVELOPER_ID_APPLICATION\"" >/dev/null

          entitlements="$state/release.entitlements"
          cat >"$entitlements" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          EOF
          plutil -lint "$entitlements" >/dev/null
          app="$state/release-input/GTA Claw.app"
          verifier="$GITHUB_WORKSPACE/trusted-release-policy/.github/trusted/desktop-supply-chain-policy/scripts/verify-macos-app.sh"
          /bin/bash "$verifier" "$app"
          if [[ -d "$app/Contents/Frameworks" ]]; then
            while IFS= read -r code; do
              codesign --force --options runtime --timestamp \
                --sign "$DEVELOPER_ID_APPLICATION" "$code"
            done < <(find "$app/Contents/Frameworks" -type f \( -name '*.dylib' -o -perm -111 \) -print)
          fi
          codesign --force --options runtime --timestamp \
            --entitlements "$entitlements" \
            --identifier com.gtastudio.gta-claw \
            --sign "$DEVELOPER_ID_APPLICATION" \
            "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          /bin/bash "$verifier" "$app"
          details="$(codesign -dvvv "$app" 2>&1)"
          requirement="$(codesign -d -r- "$app" 2>&1)"
          grep -F 'Authority=Developer ID Application:' <<<"$details" >/dev/null
          grep -F 'Timestamp=' <<<"$details" >/dev/null
          grep -E 'flags=.*runtime' <<<"$details" >/dev/null
          grep -F 'identifier "com.gtastudio.gta-claw"' <<<"$requirement" >/dev/null

      - name: Notarize and staple signed app
        shell: bash
        env:
          ASC_KEY_P8: ${{ secrets.MACOS_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.MACOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.MACOS_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for variable in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            test -n "${!variable:-}" || {
              echo "Protected notarization secret is missing: $variable" >&2
              exit 1
            }
          done
          state="$RUNNER_TEMP/gta-claw-release"
          key="$state/AuthKey.p8"
          archive="$state/GTA-Claw.app.zip"
          result="$state/app-notary-result.json"
          trap 'rm -f -- "$key" "$archive" "$result"' EXIT INT TERM
          printf '%s' "$ASC_KEY_P8" >"$key"
          app="$state/release-input/GTA Claw.app"
          verifier="$GITHUB_WORKSPACE/trusted-release-policy/.github/trusted/desktop-supply-chain-policy/scripts/verify-macos-app.sh"
          /bin/bash "$verifier" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$archive"
          xcrun notarytool submit "$archive" \
            --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --output-format json >"$result"
          status="$(plutil -extract status raw -o - "$result")"
          request_id="$(plutil -extract id raw -o - "$result")"
          if [[ "$status" != "Accepted" ]]; then
            xcrun notarytool log "$request_id" \
              --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            echo "Application notarization was not accepted" >&2
            exit 1
          fi
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          /bin/bash "$verifier" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Import installer identity and sign DMG and PKG
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER }}
          INSTALLER_CERTIFICATE_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for variable in \
            DEVELOPER_ID_APPLICATION DEVELOPER_ID_INSTALLER \
            INSTALLER_CERTIFICATE_P12 INSTALLER_CERTIFICATE_PASSWORD; do
            test -n "${!variable:-}" || {
              echo "Protected container-signing secret is missing: $variable" >&2
              exit 1
            }
          done
          [[ "$DEVELOPER_ID_APPLICATION" == "Developer ID Application:"* ]]
          [[ "$DEVELOPER_ID_INSTALLER" == "Developer ID Installer:"* ]]

          state="$RUNNER_TEMP/gta-claw-release"
          keychain="$state/signing.keychain-db"
          keychain_password="$(cat "$state/keychain-password")"
          installer_p12="$state/installer.p12"
          trap 'rm -f -- "$installer_p12"' EXIT INT TERM
          printf '%s' "$INSTALLER_CERTIFICATE_P12" | base64 -D >"$installer_p12"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$installer_p12" \
            -k "$keychain" -P "$INSTALLER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security find-identity -v "$keychain" |
            grep -F "\"$DEVELOPER_ID_INSTALLER\"" >/dev/null

          app="$state/release-input/GTA Claw.app"
          distribution="$state/distribution"
          dmg_stage="$state/dmg-stage"
          package_root="$state/package-root"
          mkdir -m 0700 "$distribution" "$dmg_stage" "$package_root"
          mkdir -m 0755 "$package_root/Applications"
          ditto "$app" "$dmg_stage/GTA Claw.app"
          ditto "$app" "$package_root/Applications/GTA Claw.app"
          test -z "$(find "$dmg_stage" "$package_root" -type l -print -quit)"
          verifier="$GITHUB_WORKSPACE/trusted-release-policy/.github/trusted/desktop-supply-chain-policy/scripts/verify-macos-app.sh"
          /bin/bash "$verifier" "$dmg_stage/GTA Claw.app"
          /bin/bash "$verifier" "$package_root/Applications/GTA Claw.app"

          dmg="$distribution/gta-claw-${{ needs.release-policy.outputs.version }}-macos.dmg"
          hdiutil create \
            -srcfolder "$dmg_stage" \
            -volname "GTA Claw ${{ needs.release-policy.outputs.version }}" \
            -fs HFS+ -format UDZO -ov "$dmg"
          hdiutil verify "$dmg" >/dev/null

          component_pkg="$state/gta-claw-component.pkg"
          pkgbuild \
            --root "$package_root" \
            --install-location / \
            --identifier com.gtastudio.gta-claw.pkg.component \
            --version "${{ needs.release-policy.outputs.version }}" \
            --ownership recommended \
            "$component_pkg"
          pkg="$distribution/gta-claw-${{ needs.release-policy.outputs.version }}-macos.pkg"
          productbuild \
            --package "$component_pkg" \
            --sign "$DEVELOPER_ID_INSTALLER" \
            --keychain "$keychain" \
            "$pkg"
          codesign --force \
            --sign "$DEVELOPER_ID_APPLICATION" \
            --timestamp \
            --identifier com.gtastudio.gta-claw.dmg \
            "$dmg"
          codesign --verify --verbose=2 "$dmg"
          pkgutil --check-signature "$pkg" |
            grep -F 'Developer ID Installer:' >/dev/null

      - name: Notarize and staple DMG and PKG
        shell: bash
        env:
          ASC_KEY_P8: ${{ secrets.MACOS_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.MACOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.MACOS_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for variable in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            test -n "${!variable:-}" || {
              echo "Protected notarization secret is missing: $variable" >&2
              exit 1
            }
          done
          state="$RUNNER_TEMP/gta-claw-release"
          key="$state/AuthKey.p8"
          trap 'rm -f -- "$key" "$state"/*-notary-result.json' EXIT INT TERM
          printf '%s' "$ASC_KEY_P8" >"$key"
          for artifact in "$state"/distribution/*.{dmg,pkg}; do
            result="$state/$(basename "$artifact")-notary-result.json"
            xcrun notarytool submit "$artifact" \
              --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
              --wait --output-format json >"$result"
            status="$(plutil -extract status raw -o - "$result")"
            request_id="$(plutil -extract id raw -o - "$result")"
            if [[ "$status" != "Accepted" ]]; then
              xcrun notarytool log "$request_id" \
                --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
              echo "Container notarization was not accepted: $artifact" >&2
              exit 1
            fi
            xcrun stapler staple "$artifact"
            xcrun stapler validate "$artifact"
          done

      - name: Assemble final signed and notarized release
        shell: bash
        env:
          EXPECTED_PAYLOAD_SHA256: ${{ needs.containers.outputs.release-payload-sha256 }}
          EXPECTED_RELEASE_REF: ${{ needs.release-policy.outputs.release-ref }}
          EXPECTED_RELEASE_SHA: ${{ needs.release-policy.outputs.release-sha }}
          EXPECTED_VERSION: ${{ needs.release-policy.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$EXPECTED_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          state="$RUNNER_TEMP/gta-claw-release"
          app="$state/release-input/GTA Claw.app"
          distribution="$state/distribution"
          app_zip="$distribution/gta-claw-$EXPECTED_VERSION-macos-arm64-signed-notarized.app.zip"
          dmg="$distribution/gta-claw-$EXPECTED_VERSION-macos.dmg"
          pkg="$distribution/gta-claw-$EXPECTED_VERSION-macos.pkg"
          [[ -d "$app" && ! -L "$app" ]]
          for artifact in "$dmg" "$pkg"; do
            [[ -f "$artifact" && ! -L "$artifact" ]]
          done
          for path in "$app_zip" "$app_zip.spdx" "$app_zip.provenance.json" \
            "$dmg.spdx" "$dmg.provenance.json" \
            "$pkg.spdx" "$pkg.provenance.json"; do
            test ! -e "$path"
            test ! -L "$path"
          done

          COPYFILE_DISABLE=1 ditto -c -k --keepParent "$app" "$app_zip"
          test -f "$app_zip" -a ! -L "$app_zip"

          spdx_parser="$state/validate-spdx-tag-value.py"
          cat >"$spdx_parser" <<'PY'
          import pathlib
          import re
          import sys
          from urllib.parse import urlparse

          CHECKSUM_LENGTHS = {"SHA1": 40, "SHA256": 64}
          DOCUMENT_TAGS = {
              "SPDXVersion",
              "DataLicense",
              "SPDXID",
              "DocumentName",
              "DocumentNamespace",
              "Creator",
              "Created",
              "DocumentDescribes",
          }
          FILE_TAGS = {
              "FileName",
              "SPDXID",
              "FileChecksum",
              "LicenseConcluded",
              "FileCopyrightText",
          }
          PACKAGE_TAGS = {
              "PackageName",
              "SPDXID",
              "PackageVersion",
              "PackageDownloadLocation",
              "FilesAnalyzed",
              "PackageLicenseConcluded",
              "PackageLicenseDeclared",
              "PackageCopyrightText",
              "ExternalRef",
          }

          def parse(path):
              sections = {"document": [], "files": [], "packages": []}
              current = sections["document"]
              for number, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if not raw:
                      continue
                  match = re.fullmatch(r"([A-Za-z][A-Za-z0-9]*): (.+)", raw)
                  if not match:
                      raise ValueError(f"{path}:{number}: malformed tag/value line")
                  tag, value = match.groups()
                  if tag == "FileName":
                      current = []
                      sections["files"].append(current)
                  elif tag == "PackageName":
                      current = []
                      sections["packages"].append(current)
                  current.append((tag, value, number))
              return sections

          def indexed(entries, allowed, label):
              values = {}
              for tag, value, number in entries:
                  if tag not in allowed:
                      raise ValueError(f"{label}:{number}: unexpected tag {tag}")
                  values.setdefault(tag, []).append(value)
              return values

          def one(values, tag, label):
              found = values.get(tag, [])
              if len(found) != 1:
                  raise ValueError(f"{label}: expected exactly one {tag}, found {len(found)}")
              return found[0]

          def validate(path, expected_name, expected_sha1, expected_sha256, expected_version):
              sections = parse(path)
              document = indexed(sections["document"], DOCUMENT_TAGS, "document")
              if one(document, "SPDXVersion", "document") != "SPDX-2.3":
                  raise ValueError("document: SPDXVersion must be SPDX-2.3")
              if one(document, "DataLicense", "document") != "CC0-1.0":
                  raise ValueError("document: DataLicense must be CC0-1.0")
              if one(document, "SPDXID", "document") != "SPDXRef-DOCUMENT":
                  raise ValueError("document: invalid SPDXID")
              namespace = one(document, "DocumentNamespace", "document")
              parsed_namespace = urlparse(namespace)
              if parsed_namespace.scheme != "https" or not parsed_namespace.netloc:
                  raise ValueError("document: namespace must be an absolute HTTPS URI")
              if one(document, "DocumentDescribes", "document") != "SPDXRef-Artifact":
                  raise ValueError("document: must describe SPDXRef-Artifact")
              one(document, "DocumentName", "document")
              one(document, "Creator", "document")
              one(document, "Created", "document")

              if len(sections["files"]) != 1:
                  raise ValueError("document: expected exactly one file")
              file_values = indexed(sections["files"][0], FILE_TAGS, "file")
              if one(file_values, "FileName", "file") != f"./{expected_name}":
                  raise ValueError("file: unexpected FileName")
              if one(file_values, "SPDXID", "file") != "SPDXRef-Artifact":
                  raise ValueError("file: invalid SPDXID")
              if one(file_values, "LicenseConcluded", "file") != "NOASSERTION":
                  raise ValueError("file: invalid LicenseConcluded")
              if one(file_values, "FileCopyrightText", "file") != "NOASSERTION":
                  raise ValueError("file: invalid FileCopyrightText")
              checksums = {}
              for checksum in file_values.get("FileChecksum", []):
                  match = re.fullmatch(r"(SHA1|SHA256): ([0-9a-f]+)", checksum)
                  if not match:
                      raise ValueError("file: malformed FileChecksum")
                  algorithm, digest = match.groups()
                  if len(digest) != CHECKSUM_LENGTHS[algorithm] or algorithm in checksums:
                      raise ValueError("file: invalid or duplicate FileChecksum")
                  checksums[algorithm] = digest
              if checksums != {"SHA1": expected_sha1, "SHA256": expected_sha256}:
                  raise ValueError("file: checksum set differs from final artifact bytes")

              if len(sections["packages"]) != 1:
                  raise ValueError("document: expected exactly one package")
              package = indexed(sections["packages"][0], PACKAGE_TAGS, "package")
              if one(package, "PackageName", "package") != "gta-claw-desktop":
                  raise ValueError("package: unexpected PackageName")
              if one(package, "SPDXID", "package") != "SPDXRef-Package-gta-claw-desktop":
                  raise ValueError("package: invalid SPDXID")
              if one(package, "PackageVersion", "package") != expected_version:
                  raise ValueError("package: unexpected PackageVersion")
              if one(package, "PackageDownloadLocation", "package") != "NOASSERTION":
                  raise ValueError("package: invalid PackageDownloadLocation")
              if one(package, "FilesAnalyzed", "package") != "false":
                  raise ValueError("package: FilesAnalyzed must be false")
              if one(package, "PackageLicenseConcluded", "package") != "NOASSERTION":
                  raise ValueError("package: invalid PackageLicenseConcluded")
              if one(package, "PackageLicenseDeclared", "package") != "MIT":
                  raise ValueError("package: invalid PackageLicenseDeclared")
              if one(package, "PackageCopyrightText", "package") != "NOASSERTION":
                  raise ValueError("package: invalid PackageCopyrightText")
              if not one(package, "ExternalRef", "package").startswith(
                  "PACKAGE-MANAGER purl pkg:cargo/gta-claw-desktop@"
              ):
                  raise ValueError("package: invalid ExternalRef")

          if len(sys.argv) != 6:
              raise SystemExit(
                  "usage: validate-spdx-tag-value.py SPDX NAME SHA1 SHA256 VERSION"
              )
          validate(pathlib.Path(sys.argv[1]), *sys.argv[2:])
          PY
          chmod 0500 "$spdx_parser"

          write_supply_chain() {
            local artifact="$1"
            local name
            local sha1
            local sha256
            name="$(basename "$artifact")"
            sha1="$(shasum -a 1 "$artifact" | awk '{print $1}')"
            sha256="$(shasum -a 256 "$artifact" | awk '{print $1}')"
            cat >"$artifact.spdx" <<EOF
          SPDXVersion: SPDX-2.3
          DataLicense: CC0-1.0
          SPDXID: SPDXRef-DOCUMENT
          DocumentName: $name SBOM
          DocumentNamespace: https://github.com/GTAStudio/GTA-Claw/releases/sbom/$sha256
          Creator: Tool: GTA-Claw-macOS-Protected-Release
          Created: 2000-01-01T00:00:00Z
          DocumentDescribes: SPDXRef-Artifact

          FileName: ./$name
          SPDXID: SPDXRef-Artifact
          FileChecksum: SHA1: $sha1
          FileChecksum: SHA256: $sha256
          LicenseConcluded: NOASSERTION
          FileCopyrightText: NOASSERTION

          PackageName: gta-claw-desktop
          SPDXID: SPDXRef-Package-gta-claw-desktop
          PackageVersion: $EXPECTED_VERSION
          PackageDownloadLocation: NOASSERTION
          FilesAnalyzed: false
          PackageLicenseConcluded: NOASSERTION
          PackageLicenseDeclared: MIT
          PackageCopyrightText: NOASSERTION
          ExternalRef: PACKAGE-MANAGER purl pkg:cargo/gta-claw-desktop@$EXPECTED_VERSION
          EOF
            jq -cn \
              --arg digest "$sha256" \
              --arg inputDigest "$EXPECTED_PAYLOAD_SHA256" \
              --arg name "$name" \
              --arg releaseRef "$EXPECTED_RELEASE_REF" \
              --arg source "$EXPECTED_RELEASE_SHA" \
              --arg version "$EXPECTED_VERSION" \
              '{
                "_type": "https://in-toto.io/Statement/v1",
                "subject": [{"name": $name, "digest": {"sha256": $digest}}],
                "predicateType": "https://slsa.dev/provenance/v1",
                "predicate": {
                  "buildDefinition": {
                    "buildType": "https://github.com/GTAStudio/GTA-Claw/packaging/macos/protected-release/v1",
                    "externalParameters": {
                      "componentSet": "desktop",
                      "cargoProfile": "release",
                      "releaseRef": $releaseRef,
                      "releaseVersion": $version,
                      "rustTargets": ["aarch64-apple-darwin"]
                    },
                    "internalParameters": {},
                    "resolvedDependencies": [{
                      "uri": "gta-claw-release-input.tar.gz",
                      "digest": {"sha256": $inputDigest}
                    }]
                  },
                  "runDetails": {
                    "builder": {
                      "id": "https://github.com/GTAStudio/GTA-Claw/.github/workflows/macos-packaging.yml"
                    },
                    "metadata": {"invocationId": $source}
                  }
                }
              }' >"$artifact.provenance.json"
            python3 "$spdx_parser" \
              "$artifact.spdx" "$name" "$sha1" "$sha256" "$EXPECTED_VERSION"
          }

          for artifact in "$app_zip" "$dmg" "$pkg"; do
            write_supply_chain "$artifact"
          done

      - name: Validate protected release outputs
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.release-policy.outputs.release-sha }}
          EXPECTED_VERSION: ${{ needs.release-policy.outputs.version }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/gta-claw-release"
          app="$state/release-input/GTA Claw.app"
          distribution="$state/distribution"
          app_zip="$distribution/gta-claw-$EXPECTED_VERSION-macos-arm64-signed-notarized.app.zip"
          dmg="$distribution/gta-claw-$EXPECTED_VERSION-macos.dmg"
          pkg="$distribution/gta-claw-$EXPECTED_VERSION-macos.pkg"
          verifier="$GITHUB_WORKSPACE/trusted-release-policy/.github/trusted/desktop-supply-chain-policy/scripts/verify-macos-app.sh"
          /bin/bash "$verifier" "$app"
          lipo "$app/Contents/MacOS/gta-claw-desktop" -verify_arch arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          codesign --verify --verbose=2 "$dmg"
          pkgutil --check-signature "$pkg" |
            grep -F 'Developer ID Installer:' >/dev/null
          xcrun stapler validate "$dmg"
          xcrun stapler validate "$pkg"

          expected="$state/expected-macos-assets"
          for artifact in "$app_zip" "$dmg" "$pkg"; do
            name="$(basename "$artifact")"
            printf '%s\n' "$name" "$name.spdx" "$name.provenance.json"
          done | LC_ALL=C sort >"$expected"
          actual="$state/actual-macos-assets"
          find "$distribution" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; |
            LC_ALL=C sort >"$actual"
          if ! diff -u "$expected" "$actual"; then
            echo "Protected macOS release asset set is incomplete or unexpected." >&2
            exit 1
          fi
          test -z "$(find "$distribution" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"

          zip_listing="$state/final-app-zip.list"
          zipinfo -1 "$app_zip" >"$zip_listing"
          if grep -E '(^/|(^|/)\.\.(/|$)|\\)' "$zip_listing"; then
            echo "Final app ZIP contains an unsafe path." >&2
            exit 1
          fi
          zip_stage="$state/final-app-zip"
          mkdir -m 0700 "$zip_stage"
          ditto -x -k "$app_zip" "$zip_stage"
          [[ -d "$zip_stage/GTA Claw.app" && ! -L "$zip_stage/GTA Claw.app" ]]
          test -z "$(find "$zip_stage" -type l -print -quit)"
          /bin/bash "$verifier" "$zip_stage/GTA Claw.app"
          codesign --verify --deep --strict --verbose=2 "$zip_stage/GTA Claw.app"
          spctl --assess --type execute --verbose=4 "$zip_stage/GTA Claw.app"
          xcrun stapler validate "$zip_stage/GTA Claw.app"

          for artifact in "$app_zip" "$dmg" "$pkg"; do
            name="$(basename "$artifact")"
            sha1="$(shasum -a 1 "$artifact" | awk '{print $1}')"
            sha256="$(shasum -a 256 "$artifact" | awk '{print $1}')"
            python3 "$state/validate-spdx-tag-value.py" \
              "$artifact.spdx" "$name" "$sha1" "$sha256" "$EXPECTED_VERSION"
            jq -e \
              --arg digest "$sha256" \
              --arg name "$name" \
              --arg source "$EXPECTED_RELEASE_SHA" \
              '.subject == [{"name": $name, "digest": {"sha256": $digest}}] and
               .predicate.runDetails.metadata.invocationId == $source' \
              "$artifact.provenance.json" >/dev/null
          done

          manifest="$state/SHA256SUMS-macos"
          (
            cd "$distribution"
            for artifact in ./*; do
              digest="$(shasum -a 256 "$artifact" | awk '{print $1}')"
              printf '%s  %s\n' "$digest" "${artifact#./}"
            done
          ) >"$manifest"
          mv "$manifest" "$distribution/SHA256SUMS-macos"
          printf '%s\n' SHA256SUMS-macos >>"$expected"
          LC_ALL=C sort -o "$expected" "$expected"
          find "$distribution" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; |
            LC_ALL=C sort >"$actual"
          diff -u "$expected" "$actual"
          echo "Protected release contract passed."

      - name: Publish exact bytes to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          distribution="$RUNNER_TEMP/gta-claw-release/distribution"
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || {
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "GTA Claw $tag" \
              --notes 'Native Rust release artifacts. Verify platform SHA256SUMS, SBOMs, and provenance before installation.' ||
              gh release view "$tag" >/dev/null
          }
          release_json="$(gh release view "$tag" --json isDraft)"
          if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
            echo "Refusing to replace assets on an already-published release." >&2
            exit 1
          fi
          existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          if grep -Fqx SHA256SUMS-macos <<<"$existing"; then
            echo "macOS release completion is already immutable; retaining published bytes."
            exit 0
          fi
          existing_dir="$(mktemp -d "$RUNNER_TEMP/gta-claw-existing-macos-release.XXXXXX")"
          paths=()
          for path in "$distribution"/*; do
            if [[ ! -f "$path" || -L "$path" ]]; then
              echo "Refusing non-regular macOS release asset: $path" >&2
              exit 1
            fi
            name="$(basename "$path")"
            if [[ "$name" == "SHA256SUMS-macos" ]]; then
              continue
            fi
            if grep -Fqx "$name" <<<"$existing"; then
              gh release download "$tag" --pattern "$name" --dir "$existing_dir"
              if ! cmp "$path" "$existing_dir/$name"; then
                echo "Refusing to discard different existing release bytes: $name" >&2
                exit 1
              fi
            else
              paths+=("$path")
            fi
          done
          [[ "${#paths[@]}" -gt 0 || -n "$existing" ]] || {
            echo "No macOS release artifacts are available to upload." >&2
            exit 1
          }
          if [[ "${#paths[@]}" -gt 0 ]]; then
            gh release upload "$tag" "${paths[@]}"
          fi
          gh release upload "$tag" "$distribution/SHA256SUMS-macos"

      - name: Always remove temporary keychain and credentials
        if: always()
        shell: bash
        run: |
          set +e
          state="$RUNNER_TEMP/gta-claw-release"
          keychain="$state/signing.keychain-db"
          security list-keychains -d user -s \
            "$HOME/Library/Keychains/login.keychain-db" >/dev/null 2>&1
          if [[ -f "$keychain" && ! -L "$keychain" ]]; then
            security delete-keychain "$keychain" >/dev/null 2>&1
          fi
          rm -rf -- "$RUNNER_TEMP/gta-claw-release-download"
          rm -rf -- "$state"

  finalize-release:
    name: Finalize joint desktop release
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    needs: protected-release-contract
    permissions:
      contents: write
    uses: ./.github/workflows/joint-release-finalize.yml
    with:
      tag: ${{ github.ref_name }}
